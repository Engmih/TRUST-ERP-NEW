/* ===== محرك الحسابات المشترك (حساب العملية + حسابات العملاء) ===== */
let ACC={ready:false};
function acctLoad(cb){
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري تحميل الحسابات…</div>',crumbHome('الحسابات'));
  Promise.all([db.collection('Projects').get(),db.collection('Extracts').get(),db.collection('Spend').get(),db.collection('ContractorPayments').get(),db.collection('ClientPayments').get(),db.collection('Users').get(),db.collection('ApprovalsLog').get().catch(()=>({docs:[]})),db.collection('Contractors').get().catch(()=>({docs:[]})),db.collection('Types').get().catch(()=>({docs:[]}))])
  .then(r=>{
    ACC={ready:true,
      projs:r[0].docs.map(d=>({id:d.id,...d.data()})),
      ext:r[1].docs.map(d=>({id:d.id,...d.data()})),
      spend:r[2].docs.map(d=>({id:d.id,...d.data()})),
      cpay:r[3].docs.map(d=>({id:d.id,...d.data()})),
      clipay:r[4].docs.map(d=>({id:d.id,...d.data()})),
      users:r[5].docs.map(d=>({id:d.id,...d.data()})),
      appr:r[6].docs.map(d=>d.data()),
      conts:r[7].docs.map(d=>({id:d.id,...d.data()})),
      types:r[8].docs.map(d=>({id:d.id,...d.data()}))};
    ACC.pn={};ACC.prate={};ACC.psup={};ACC.projs.forEach(p=>{ACC.pn[p.id]=p.name||'';ACC.prate[p.id]=+p.supRate||0;ACC.psup[p.id]=String(p.supOnly)==='TRUE';});
    ACC.un={};ACC.users.forEach(u=>ACC.un[u.id]=u.name||'');
    ACC.conts.forEach(c=>{if(!ACC.un[c.id])ACC.un[c.id]=c.name||'';});
    ACC.tn={};ACC.types.forEach(t=>ACC.tn[t.id]=t.name||'');
    ACC.extFin={};ACC.appr.forEach(g=>{if(['CHAIRMAN_APPROVE','RECORD','CHAIRMAN_DIRECT'].indexOf(String(g.action||''))===-1)return;const id=String(g.extractId||''),ts=String(g.timestamp||'').slice(0,10);if(id&&ts&&(!ACC.extFin[id]||ts>ACC.extFin[id]))ACC.extFin[id]=ts;});
    /* هوية الإشراف (مطابق contIsSup_/venIsSup_): مقاول إشراف = Contractors.isSup أو Users.isContractor+? ؛ مورد إشراف = Users.isSupVen */
    ACC.supCont={};ACC.conts.forEach(c=>{if(String(c.isSup)==='TRUE')ACC.supCont[String(c.id)]=1;});ACC.users.forEach(u=>{if(String(u.isSup)==='TRUE')ACC.supCont[String(u.id)]=1;});
    ACC.supVenId={};ACC.supVenNm={};ACC.users.forEach(u=>{if(String(u.isSupVen)==='TRUE'){ACC.supVenId[String(u.id)]=1;ACC.supVenNm[norm(u.name||'')]=1;}});
    cb();
  }).catch(e=>{shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbHome('الحسابات'));});
}
/* هل الحركة إشراف-مكتب (mine)؟ مطابق venIsSup_ */
function venIsSupNew(r){const pid=String(r.partyId||'');if(pid)return !!ACC.supVenId[pid];const vn=norm(r.vendorName||'');return vn?!!ACC.supVenNm[vn]:false;}
/* إجمالي تحصيلات العميل بالـclientId (مطابق api_cliDetail) — كل دفعاته سواء متربطة بعملية أو لأ */
function clientPaid(cid){let t=0;(ACC.clipay||[]).forEach(r=>{if(String(r.clientId)!==String(cid))return;if(String(r.void)==='TRUE')return;if((String(r.pst||'')||'APPROVED')!=='APPROVED')return;t+=+r.amount||0;});return Math.round(t*100)/100;}
/* حساب عملية واحدة — مطابق projSpend_ + projSupSplit_ + api_cliDetail
   المنصرف = مستخلصات FINAL (صافي) + كل Spend معتمد (sup/exp/set) ماعدا adv.
   عملية الإشراف: mine (أعمال مقاول الإشراف + توريد على حساب العميل) مستحقة كاملة + إشراف الكل ؛ others = إشراف بس. */
function projAcctCompute(pid){
  pid=String(pid);const spDone=r=>(String(r.st||'APPROVED'))==='APPROVED'&&String(r.void)!=='TRUE';const payOK=r=>String(r.void)!=='TRUE'&&((String(r.pst||'')||'APPROVED')==='APPROVED');
  const o={cont:0,sup:0,exp:0,cus:0,coll:0,paid:0,exts:[],sups:[],custs:[],colls:[],paids:[]};
  // مستخلصات: صافي المستحق للمنصرف · وآخر FINAL لكل سلسلة (totalValue) لتقسيم الإشراف
  const lastBySer={};
  ACC.ext.forEach(e=>{if(String(e.projectId)!==pid||String(e.status)!=='FINAL')return;const v=+e.netDue||0;o.cont+=v;o.exts.push({seq:e.seq,contId:String(e.contractorId||''),cont:ACC.un[e.contractorId]||e.contractorId||'—',type:ACC.tn[e.typeId]||'',total:+e.totalValue||0,net:v,date:ACC.extFin[e.id]||''});const k=String(e.seriesId);if(!lastBySer[k]||(+e.seq||0)>(+lastBySer[k].seq||0))lastBySer[k]=e;});
  ACC.spend.forEach(r=>{if(String(r.projectId)!==pid)return;const k=String(r.kind);if(k==='adv'){if(String(r.fromHolderId||'')&&spDone(r)){const v=+r.amount||0;o.paid+=v;o.paids.push({v:v,who:ACC.un[r.holderId]||'عهدة',it:'تسليم عهدة',date:r.sdate||''});}return;}
    if(!spDone(r))return;const v=+r.amount||0;if(!v)return;
    if(k==='sup'){o.sup+=v;o.sups.push({v:v,who:r.vendorName||'—',it:r.itemText||r.notes||'',date:r.sdate||'',mine:(String(r.billClient)==='TRUE'||venIsSupNew(r))});}
    else if(k==='set'){o.cus+=v;o.custs.push({v:v,who:r.holderName||r.vendorName||'—',it:r.itemText||r.notes||'',date:r.sdate||'',mine:(String(r.billClient)==='TRUE'||venIsSupNew(r))});}
    else {o.exp+=v;o.sups.push({v:v,who:r.vendorName||r.holderName||'مصروف',it:r.itemText||r.notes||'',date:r.sdate||'',mine:(String(r.billClient)==='TRUE'||venIsSupNew(r)),isExp:1});}});
  ACC.cpay.forEach(r=>{if(String(r.projectId)!==pid||!payOK(r))return;const v=+r.amount||0;o.paid+=v;o.paids.push({v:v,who:r.contractorName||ACC.un[r.contractorId]||'مقاول',it:r.method||'دفعة',date:r.date||''});});
  ACC.clipay.forEach(r=>{if(String(r.projectId)!==pid||!payOK(r))return;const v=+r.amount||0;o.coll+=v;o.colls.push({v:v,who:ACC.un[r.clientId]||r.clientName||'عميل',it:r.method||'تحصيل',date:r.pdate||r.date||''});});
  o.spend=o.cont+o.sup+o.exp+o.cus;o.net=o.coll-o.spend;
  o.supOnly=!!ACC.psup[pid];o.rate=+ACC.prate[pid]||0;
  if(o.supOnly){
    // تقسيم mine/others (مطابق projSupSplit_): المستخلصات بقيمة totalValue لآخر FINAL
    let mine=0,others=0;
    Object.keys(lastBySer).forEach(k=>{const e=lastBySer[k];const v=+e.totalValue||0;if(ACC.supCont[String(e.contractorId||'')])mine+=v;else others+=v;});
    ACC.spend.forEach(r=>{if(String(r.projectId)!==pid||!spDone(r))return;const k=String(r.kind);if(k==='adv')return;if(String(r.src||'')==='ext')return;const v=+r.amount||0;if(String(r.billClient)==='TRUE'||venIsSupNew(r))mine+=v;else others+=v;});
    o.supMine=Math.round(mine*100)/100;o.supOthers=Math.round(others*100)/100;
    o.supFee=Math.round((mine+others)*o.rate)/100;
    o.clientDue=Math.round((mine+o.supFee)*100)/100;
    o.clientMons=o.supMine; // المنصرف اللي بيتحمّله العميل (أعمال المكتب + على حساب العميل)
  } else {
    o.supFee=Math.round(o.spend*o.rate)/100;
    o.clientDue=Math.round((o.spend+o.supFee)*100)/100;
    o.clientMons=o.spend;
  }
  return o;
}

function openProjAcct(pid){

/* ===== المقاولين والموردين (حسابات الأطراف) ===== */
let CA={rows:[]};
function openContAcc(){
  if(permGuardAny(['contractors_view','spend_view'],'المقاولين والموردين'))return;
  detachOps();
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري حساب الأطراف…</div>',crumbSpend('المقاولين والموردين'));
  Promise.all([db.collection('Users').get(),db.collection('Series').get().catch(()=>({docs:[]})),db.collection('Extracts').get().catch(()=>({docs:[]})),db.collection('Spend').get(),db.collection('ContractorPayments').get().catch(()=>({docs:[]}))]).then(r=>{
    const users=r[1]?r[0].docs.map(d=>({id:d.id,...d.data()})):[];
    const series=r[1].docs.map(d=>({id:d.id,...d.data()}));
    const ext=r[2].docs.map(d=>({id:d.id,...d.data()}));
    const spend=r[3].docs.map(d=>({id:d.id,...d.data()}));
    const cpay=r[4].docs.map(d=>({id:d.id,...d.data()}));
    // آخر مستخلص معتمد نهائي لكل سلسلة
    const lastBySeries={};ext.forEach(e=>{if(String(e.status)!=='FINAL')return;const sid=String(e.seriesId||'');if(!sid)return;const cur=lastBySeries[sid];if(!cur||(+e.seq||0)>(+cur.seq||0))lastBySeries[sid]=e;});
    const extByCont={};Object.values(lastBySeries).forEach(e=>{const cid=String(e.contractorId||'');extByCont[cid]=(extByCont[cid]||0)+(+e.totalValue||0);});
    // توريدات معتمدة
    const supByParty={},supByName={};spend.forEach(s=>{if(String(s.void)==='TRUE'||String(s.kind)!=='sup'||String(s.st||'APPROVED')!=='APPROVED')return;const v=+s.amount||0;const pid=String(s.partyId||'');if(pid)supByParty[pid]=(supByParty[pid]||0)+v;const vn=norm(s.vendorName||'');if(vn)supByName[vn]=(supByName[vn]||0)+v;});
    // مدفوع معتمد
    const paidByParty={};cpay.forEach(p=>{if(String(p.void)==='TRUE'||String(p.pst||'APPROVED')!=='APPROVED')return;const pid=String(p.partyId||'');if(pid)paidByParty[pid]=(paidByParty[pid]||0)+(+p.amount||0);});
    CA.rows=users.filter(u=>String(u.isContractor)==='TRUE'||String(u.isVendor)==='TRUE').map(u=>{
      const co=String(u.isContractor)==='TRUE',ve=String(u.isVendor)==='TRUE';
      const mos=co?(extByCont[String(u.contractorId||'')]||0):0;
      const tor=(supByParty[String(u.id)]||0)||(supByName[norm(u.name||'')]||0);
      const paid=paidByParty[String(u.id)]||0;
      const due=mos+tor;return {id:u.id,name:u.name||'',co:co,ve:ve,mos:mos,tor:tor,due:due,paid:paid,rem:due-paid};
    }).filter(x=>x.due||x.paid).sort((a,b)=>b.rem-a.rem);
    renderContAcc();
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbSpend('المقاولين والموردين')));
}

  const tot=CA.rows.reduce((a,x)=>({mos:a.mos+x.mos,tor:a.tor+x.tor,due:a.due+x.due,paid:a.paid+x.paid,rem:a.rem+x.rem}),{mos:0,tor:0,due:0,paid:0,rem:0});
  const h='<div class="card"><h3 style="margin:0">🤝 المقاولين والموردين</h3><div class="muted" style="font-size:12.5px;margin-top:3px">'+CA.rows.length+' طرف · مستخلصات '+fmt(tot.mos)+' · توريدات '+fmt(tot.tor)+' · المستحق <b style="color:var(--red)">'+fmt(tot.rem)+'</b></div>'+
    '<input id="ca_q" placeholder="ابحث بالاسم…" oninput="renderContAcc2()" style="width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:Tajawal;font-size:14px"></div>'+
    '<div id="ca_body"></div>';
  shell(h,crumbSpend('المقاولين والموردين'));renderContAcc2();
}

      '<td class="num" style="color:#1F7A3D">'+fmt(x.paid)+'</td>'+

}

async function typeAdd(){
  const nm=((el('ty_new')||{}).value||'').trim();if(!nm){pfToast('اكتب اسم النوع',false);return;}
  if(TY.types.some(t=>norm(t.name)===norm(nm))){pfToast('النوع موجود',false);return;}
  try{const id=genId('ty');await db.collection('Types').doc(id).set({id:id,name:nm});TY.types.push({id:id,name:nm});TY.types.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));renderTypes();pfToast('اتضاف ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
async function typeRename(id){
  const t=TY.types.find(x=>String(x.id)===String(id));if(!t)return;const nm=(prompt('الاسم الجديد:',t.name||'')||'').trim();if(!nm||nm===t.name)return;
  if(TY.types.some(x=>String(x.id)!==String(id)&&norm(x.name)===norm(nm))){pfToast('النوع موجود',false);return;}
  try{await db.collection('Types').doc(String(id)).set({name:nm},{merge:true});t.name=nm;renderTypes();pfToast('اتعدّل ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
async function typeDel(id){
  const t=TY.types.find(x=>String(x.id)===String(id));if(!t)return;const us=TY.usage[id];
  if(us&&us.s){pfToast('النوع مستخدم في '+us.s+' سلسلة — حوّلهم الأول',false);return;}
  if(!confirm('تحذف نوع «'+(t.name||'')+'»؟'))return;
  try{await db.collection('Types').doc(String(id)).delete();TY.types=TY.types.filter(x=>String(x.id)!==String(id));renderTypes();pfToast('اتحذف',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
/* ===== المكتبات (عرض) — التعديل الكامل مع المستخلصات/الطلبيات ===== */
function libView(title,groupColl,itemColl,groupField,crumbName){
  detachOps();
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:30px">جاري التحميل…</div>',crumbSpend(crumbName));
  Promise.all([db.collection(groupColl).get().catch(()=>({docs:[]})),db.collection(itemColl).get().catch(()=>({docs:[]}))]).then(r=>{
    const groups=r[0].docs.map(d=>({id:d.id,...d.data()}));
    const items=r[1].docs.map(d=>({id:d.id,...d.data()}));
    const cnt={};items.forEach(it=>{const g=String(it[groupField]||'');if(g)cnt[g]=(cnt[g]||0)+1;});
    const h='<div class="card"><h3 style="margin:0">🏷️ '+esc(title)+'</h3><div class="muted" style="font-size:12px;margin-top:3px">'+groups.length+' مجموعة · '+items.length+' بند. التعديل الكامل (إضافة/تعديل بنود) بيتفعّل مع شاشات المستخلصات والطلبيات في نفس التسليمة.</div></div>'+
      '<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>المجموعة</th><th>عدد البنود</th></tr></thead><tbody>'+
      (groups.sort((a,b)=>String(a.name||a.order||'').localeCompare(String(b.name||b.order||''),'ar')).map(g=>'<tr><td><b>'+esc(g.name||'—')+'</b></td><td class="num">'+(cnt[g.id]||0)+'</td></tr>').join('')||'<tr><td colspan="2" class="muted" style="padding:14px;text-align:center">مفيش مجموعات</td></tr>')+
      '</tbody></table></div>';
    shell(h,crumbSpend(crumbName));
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbSpend(crumbName)));
}
function openSupLib(){libView('مكتبة التوريدات','SupGroups','SupItems','groupId','مكتبة التوريدات');}
function openExpLib(){libView('مكتبة بنود المصروف','ExpGroups','ExpItems','groupId','مكتبة البنود');}

/* ===== المستخلصات: سلاسل → مستخلصات → مستخلص ===== */
const EXST_AR={DRAFT:'مسودة عند المهندس',SENT_TECH:'عند المكتب الفني',RETURNED_TECH:'مُرجَع للمهندس',APPROVED_TECH:'عند الحسابات',RECORDED:'عند رئيس المجلس',RETURNED_CHAIRMAN:'مُرجَع للحسابات',APPROVED_CHAIRMAN:'عند الحسابات',FINAL:'معتمد نهائي ✓'};
function extStPill(st){const x=EXST_AR[st]||st||'—';const c=st==='FINAL'?['#EAF3DE','#27500A']:((st==='RETURNED_TECH'||st==='RETURNED_CHAIRMAN')?['#FBE3E1','#8E2620']:(st==='DRAFT'?['#EEE','#444']:['#FFF4E0','#B26A00']));return '<span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+esc(x)+'</span>';}
/* أفعال المستخلص حسب الدور والحالة (مطابق actionsFor_) */
function extActions(st){const r=S.user.role,a=[];
  if(r==='engineer'&&(st==='DRAFT'||st==='RETURNED_TECH'))a.push(['SUBMIT','📤 اعتماد وإرسال','#1F7A3D']);
  if(r==='technical'&&st==='DRAFT')a.push(['TECH_DIRECT','⚡ اعتماد مباشر للحسابات','#8a5a00']);
  if(r==='technical'&&st==='SENT_TECH'){a.push(['TECH_APPROVE','✅ اعتماد المكتب الفني','#1F7A3D']);a.push(['TECH_RETURN','↩️ إرجاع للمهندس','#B3261E']);}
  if(r==='accounts'&&['APPROVED_TECH','APPROVED_CHAIRMAN','RETURNED_CHAIRMAN'].indexOf(st)!==-1){a.push(['RECORD','✅ تسجيل بالحسابات','#1F7A3D']);a.push(['ACC_RETURN','↩️ إرجاع للمكتب الفني','#B3261E']);}
  if(r==='chairman'&&st==='RECORDED'){a.push(['CHAIRMAN_APPROVE','✅ اعتماد نهائي','#1F7A3D']);a.push(['CHAIRMAN_RETURN','↩️ إرجاع للحسابات','#B3261E']);}
  if(r==='chairman'&&['DRAFT','SENT_TECH','APPROVED_TECH'].indexOf(st)!==-1)a.push(['CHAIRMAN_DIRECT','⚡ اعتماد مباشر نهائي','#8a5a00']);
  return a;}
function extNext(action){return {SUBMIT:'SENT_TECH',TECH_DIRECT:'APPROVED_TECH',TECH_APPROVE:'APPROVED_TECH',TECH_RETURN:'RETURNED_TECH',RECORD:'RECORDED',ACC_RETURN:'SENT_TECH',CHAIRMAN_APPROVE:'FINAL',CHAIRMAN_DIRECT:'FINAL',CHAIRMAN_RETURN:'RETURNED_CHAIRMAN'}[action]||'';}
function lineColorOf(l){const prev=(l.prevTranches||[]).reduce((a,b)=>a+(+b||0),0),cur=+l.currPct||0;if(l.adj)return ['#FBF3E0','بيچ'];if(cur>0)return ['#EDF6E3','green'];if(prev>=100)return ['#E9F0FB','blue'];return ['#FBEAE7','red'];}
let EX={ex:null,lines:[],wi:{},gn:{},fn:{},sn:{},series:null};
function openSeries(pid){

  Promise.all([db.collection('Projects').doc(pid).get(),db.collection('Series').get().catch(()=>({docs:[]})),db.collection('Extracts').get().catch(()=>({docs:[]})),db.collection('Types').get().catch(()=>({docs:[]})),db.collection('Contractors').get().catch(()=>({docs:[]}))]).then(r=>{

    const rows=series.map(s=>{const a=bySer[String(s.id)]||{n:0,last:null};return {id:s.id,type:tn[s.typeId]||'',cont:cn[s.contractorId]||'',n:a.n,last:a.last};}).sort((a,b)=>(a.cont+a.type).localeCompare(b.cont+b.type,'ar'));

function openExtract(exId){
  detachOps();
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري تحميل المستخلص…</div>',crumbHome('مستخلص'));
  db.collection('Extracts').doc(exId).get().then(d=>{
    if(!d.exists)throw new Error('المستخلص غير موجود');
    EX.ex={id:d.id,...d.data()};
    return Promise.all([
      db.collection('Lines').where('extractId','==',exId).get().catch(()=>({docs:[]})),
      db.collection('WorkItems').get().catch(()=>({docs:[]})),
      db.collection('ExpGroups').get().catch(()=>({docs:[]})),
      db.collection('Floors').get().catch(()=>({docs:[]})),
      db.collection('SubLocs').get().catch(()=>({docs:[]})),
      db.collection('Contractors').doc(String(EX.ex.contractorId||'_')).get().catch(()=>({exists:false})),
      db.collection('Types').doc(String(EX.ex.typeId||'_')).get().catch(()=>({exists:false})),
      db.collection('Projects').doc(String(EX.ex.projectId||'_')).get().catch(()=>({exists:false})),
      db.collection('ApprovalsLog').where('extractId','==',exId).get().catch(()=>({docs:[]})),
      db.collection('Extracts').where('seriesId','==',String(EX.ex.seriesId||'_')).get().catch(()=>({docs:[]}))
    ]).then(r=>{
      let mx=0;r[9].docs.forEach(x=>{mx=Math.max(mx,+x.data().seq||0);});EX.isLast=((+EX.ex.seq||0)===mx);
      EX.wi={};r[1].docs.forEach(x=>EX.wi[x.id]={id:x.id,...x.data()});
      EX.gn={};r[2].docs.forEach(x=>EX.gn[x.id]=x.data().name||'');
      EX.fn={};r[3].docs.forEach(x=>EX.fn[x.id]=x.data().name||'');
      EX.sn={};r[4].docs.forEach(x=>EX.sn[x.id]=x.data().name||'');
      EX.cont=r[5].exists?r[5].data():null;EX.type=r[6].exists?r[6].data():null;EX.proj=r[7].exists?r[7].data():null;
      EX.log=r[8].docs.map(x=>x.data()).sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));
      EX.lines=r[0].docs.map(x=>{const l={id:x.id,...x.data()};let prev=[];try{prev=JSON.parse(l.prevTranches||'[]');}catch(e){if(Array.isArray(l.prevTranches))prev=l.prevTranches;}l.prevTranches=prev.map(Number);l.adj=String(l.adj)==='TRUE';return l;});
      renderExtract();
    });
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbHome('مستخلص')));
}
function lineLockedFb(l){return (l.prevTranches||[]).reduce((a,b)=>a+(+b||0),0)>0;}
function extCanEdit(){const st=String(EX.ex.status);const r=S.user.role;return EX.isLast&&(meChair()||r==='technical'||(r==='engineer'&&(st==='DRAFT'||st==='RETURNED_TECH')));}
function renderExtract(){
  const e=EX.ex;const cont=EX.cont,typ=EX.type,proj=EX.proj;const ed=EX.editing;
  const contName=cont?(cont.name||''):'';const typeName=(cont&&String(cont.trade||'').trim())||(typ?typ.name||'':'');

      '<td class="num">'+(i+1)+'</td>'+

      '<td class="num">'+(prev?prev+'%':'0%')+'</td>'+
      '<td class="num">'+(ed?'<input type="number" step="any" id="cur_'+li+'" value="'+cur+'" style="width:62px;padding:3px 5px;font-size:12px">':('<b>'+cur+'%</b>'))+'</td>'+

    (ed?'<div class="rowline" style="gap:6px"><button class="btn" id="exln_save" onclick="extSaveLines()">💾 حفظ</button><button class="btn ghost" onclick="EX.editing=false;renderExtract()">✕ إلغاء</button></div>':'<div class="rowline" style="gap:6px;flex-wrap:wrap">'+(canEd?'<button class="btn" style="background:#B3261E" onclick="EX.editing=true;renderExtract()">✏️ تعديل المستخلص</button>':'')+'<button class="btn ghost" onclick="extPrint()">🖨️ طباعة</button>'+((['technical','chairman'].indexOf(S.user.role)!==-1)?'<button class="btn ghost" onclick="noteRestoreFb()">📝 استرجاع الملاحظات</button>':'')+((meChair()&&EX.isLast)?'<button class="btn ghost" style="color:#B3261E" onclick="extDeleteFb()">🗑️ مسح المستخلص</button>':'')+'</div>')+

    (acts.length?'<div class="card"><div class="rowline" style="gap:8px;flex-wrap:wrap">'+acts.map(a=>'<button class="btn" style="background:'+a[2]+'" onclick="extAct(\''+a[0]+'\')">'+a[1]+'</button>').join('')+'</div></div>':'')+

  shell(h,crumbHome('مستخلص ('+(e.seq||'')+')'));
}

/* مسح المستخلص — آخر واحد في السلسلة فقط (مطابق api_exDelete) */
async function extDeleteFb(){

  const why=(prompt('سبب مسح المستخلص (إجباري):')||'').trim();if(why.length<3){pfToast('لازم سبب',false);return;}
  if(!confirm('مسح المستخلص الجاري ('+(e.seq||'')+') وكل بنوده نهائياً؟\nالمستخلصات السابقة ماتتلمسش وحساب المقاول بيرجع لآخر مستخلص قبله.'))return;
  try{
    const ls=await db.collection('Lines').where('extractId','==',String(e.id)).get();
    const batch=db.batch();ls.forEach(d=>batch.delete(d.ref));batch.delete(db.collection('Extracts').doc(String(e.id)));
    const lid=genId('log');batch.set(db.collection('ApprovalsLog').doc(lid),{id:lid,extractId:String(e.id),action:'EX_DEL',byName:S.user.name||'',notes:'مسح مستخلص جاري ('+(e.seq||'')+') · '+ls.size+' بند · السبب: '+why,timestamp:nowIsoFb()});

  }catch(err){pfToast('تعذّر المسح: '+(err.code||err.message),false);}
}
/* استرجاع الملاحظات الضايعة (مطابق noteFixScan_) — للمكتب الفني/الرئيس */
async function noteRestoreFb(){
  if(['technical','chairman'].indexOf(S.user.role)===-1){pfToast('الاسترجاع للمكتب الفني أو الرئيس',false);return;}
  const e=EX.ex;const sid=String(e.seriesId||'');if(!sid){pfToast('السلسلة غير معروفة',false);return;}
  pfToast('بيدوّر على الملاحظات…',true);
  try{
    const exSnap=await db.collection('Extracts').where('seriesId','==',sid).get();
    const chain=exSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(+a.seq||0)-(+b.seq||0));
    // سطور كل مستخلص على حدة لضمان الشمول
    const byEx={};for(const x of chain){const s=await db.collection('Lines').where('extractId','==',x.id).get();byEx[x.id]=s.docs.map(d=>({id:d.id,...d.data()}));}
    const byId={};Object.values(byEx).forEach(arr=>arr.forEach(l=>byId[l.id]=l));
    const fixes=[];let skipped=0;
    const keyOf=l=>[l.workItemId,l.floorId||'',l.subLocId||'',l.qty,l.price].join('\u0000');
    const looseOf=l=>[l.workItemId,l.qty,l.price].join('\u0000');
    for(let i=1;i<chain.length;i++){
      const prevLines=byEx[chain[i-1].id]||[],curLines=byEx[chain[i].id]||[];
      const src={},loose={};
      prevLines.forEach(l=>{if(!String(l.notes||'').trim())return;(src[keyOf(l)]=src[keyOf(l)]||[]).push(String(l.notes));(loose[looseOf(l)]=loose[looseOf(l)]||[]).push(String(l.notes));});
      curLines.forEach(l=>{if(String(l.notes||'').trim())return;let note='';const p=String(l.parentId||'')?byId[String(l.parentId)]:null;
        if(p&&String(p.notes||'').trim())note=String(p.notes);
        else{let c=src[keyOf(l)];if(!c)c=loose[looseOf(l)];if(!c)return;const uniq={};c.forEach(n=>uniq[n]=1);const keys=Object.keys(uniq);if(keys.length!==1){skipped++;return;}note=keys[0];}
        if(!note)return;fixes.push({lineId:l.id,exId:chain[i].id,seq:+chain[i].seq||0,note:note});});
    }
    if(!fixes.length){pfToast('مفيش ملاحظات محتاجة استرجاع'+(skipped?' ('+skipped+' ملتبس اتخطّى)':''),true);return;}
    const prev=fixes.slice(0,8).map(f=>'• مستخلص ('+f.seq+'): '+esc(f.note.slice(0,40))).join('<br>');
    modal('<h3 style="margin:0 0 6px">📝 استرجاع الملاحظات</h3><p style="font-size:13px">هيتسترجع <b>'+fixes.length+'</b> ملاحظة'+(skipped?' · اتخطّى '+skipped+' ملتبس':'')+'.</p><div style="font-size:12px;color:var(--muted);max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px">'+prev+(fixes.length>8?'<br>…':'')+'</div><div style="margin-top:10px"><button class="btn" style="background:#1F5C2E" onclick="noteRestoreApply()">✅ نفّذ الاسترجاع</button></div>');
    NOTEFIX=fixes;
  }catch(err){pfToast('تعذّر: '+(err.code||err.message),false);}
}
let NOTEFIX=[];
async function noteRestoreApply(){
  if(!NOTEFIX.length)return;
  try{for(let i=0;i<NOTEFIX.length;i+=400){const b=db.batch();NOTEFIX.slice(i,i+400).forEach(f=>b.set(db.collection('Lines').doc(String(f.lineId)),{notes:f.note},{merge:true}));await b.commit();}
    document.querySelectorAll('[data-modal]').forEach(m=>m.remove());
    pfToast('اتسترجع '+NOTEFIX.length+' ملاحظة ✅',true);NOTEFIX=[];openExtract(EX.ex.id);
  }catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
/* حارس النسبة: مفيش سالب، والمجموع ≤ 100 (مطابق pctGuard_) */
function pctGuardFb(prevArr,curr,name){const prev=(prevArr||[]).reduce((a,b)=>a+(+b||0),0);const c=+curr||0;if(c<0)throw new Error('النسبة مايصحّش تكون بالسالب — التخفيض بكمية سالبة.');if(prev+c>100+1e-9)throw new Error('البند «'+(name||'')+'» تجاوز 100% (سابق '+prev+'% + حالي '+c+'%).');return c;}
async function extSaveLines(){
  const b=el('exln_save');if(b){if(b.disabled)return;b.disabled=true;b.textContent='⏳…';}
  try{
    const batch=db.batch();let totalValue=0;
    for(const l of EX.lines){const w=EX.wi[l.workItemId]||{};const lk=lineLockedFb(l);
      let cur=parseFloat((el('cur_'+l.id)||{}).value);if(isNaN(cur))cur=+l.currPct||0;
      cur=pctGuardFb(l.prevTranches,cur,w.name);
      let qty=+l.qty||0,price=+l.price||0;
      if(!lk){const qe=el('qty_'+l.id),pe=el('price_'+l.id);if(qe&&qe.value!=='')qty=parseFloat(qe.value)||0;if(pe&&pe.value!=='')price=parseFloat(pe.value)||0;}
      const notes=(el('notes_'+l.id)||{value:l.notes}).value;
      l.currPct=cur;l.qty=qty;l.price=price;l.notes=notes;
      const prev=(l.prevTranches||[]).reduce((a,x)=>a+(+x||0),0);totalValue+=Math.round(qty*price*(prev+cur))/100;
      batch.set(db.collection('Lines').doc(String(l.id)),{currPct:cur,qty:qty,price:price,notes:notes},{merge:true});
    }
    totalValue=Math.round(totalValue*100)/100;const netDue=Math.round((totalValue-(+EX.ex.prevValue||0))*100)/100;
    batch.set(db.collection('Extracts').doc(String(EX.ex.id)),{totalValue:totalValue,netDue:netDue,updatedAt:nowIsoFb()},{merge:true});
    await batch.commit();
    EX.editing=false;pfToast('اتحفظ ✅',true);openExtract(EX.ex.id);
  }catch(e){pfToast(e.message||('تعذّر: '+(e.code||'')),false);if(b){b.disabled=false;b.textContent='💾 حفظ';}}
}

async function extAddLineSave(){
  const g=(el('al_g')||{}).value||'',name=((el('al_name')||{}).value||'').trim(),unit=((el('al_unit')||{}).value||'').trim(),qty=parseFloat((el('al_qty')||{}).value)||0,price=parseFloat((el('al_price')||{}).value)||0,pct=parseFloat((el('al_pct')||{}).value),notes=((el('al_notes')||{}).value||'').trim(),err=el('al_err');if(err)err.textContent='';

/* إنشاء مستخلص جاري (مع ترحيل بنود آخر مستخلص) — مطابق api_extractCreate */
async function createExtractFb(seriesId){
  if(['engineer','technical','chairman'].indexOf(S.user.role)===-1){pfToast('إنشاء المستخلصات للمهندس أو المكتب الفني',false);return;}
  try{
    const sdoc=await db.collection('Series').doc(String(seriesId)).get();if(!sdoc.exists)throw new Error('السلسلة غير موجودة');const s={id:sdoc.id,...sdoc.data()};
    const exSnap=await db.collection('Extracts').where('seriesId','==',String(seriesId)).get();
    const mine=exSnap.docs.map(d=>({id:d.id,...d.data()}));
    for(const e of mine){if(String(e.status)!=='FINAL'){pfToast('فيه مستخلص جاري ('+e.seq+') لسه ما اعتمدش — '+(EXST_AR[e.status]||e.status)+'. كمّله الأول.',false);return;}}
    let last=null;mine.forEach(e=>{if(!last||(+e.seq||0)>(+last.seq||0))last=e;});
    const seq=last?(+last.seq||0)+1:1;const prev=last?(+last.totalValue||0):0;
    const exId=genId('ex');
    const batch=db.batch();
    batch.set(db.collection('Extracts').doc(exId),{id:exId,seriesId:String(seriesId),projectId:String(s.projectId||''),typeId:String(s.typeId||''),contractorId:String(s.contractorId||''),seq:seq,engineerId:S.user.id||'',hasrName:S.user.name||'',reviewName:'',status:'DRAFT',totalValue:prev,prevValue:prev,netDue:0,createdAt:nowIsoFb(),updatedAt:nowIsoFb()});
    const lid=genId('log');batch.set(db.collection('ApprovalsLog').doc(lid),{id:lid,extractId:exId,action:'CREATE',byName:S.user.name||'',notes:'إنشاء مستخلص جاري '+seq,timestamp:nowIsoFb()});
    if(last){const pls=await db.collection('Lines').where('extractId','==',String(last.id)).get();
      pls.docs.forEach(d=>{const l=d.data();let pt=[];try{pt=JSON.parse(l.prevTranches||'[]');}catch(e){if(Array.isArray(l.prevTranches))pt=l.prevTranches;}pt=pt.map(Number);if(+l.currPct)pt.push(+l.currPct);
        const nid=genId('ln');batch.set(db.collection('Lines').doc(nid),{id:nid,extractId:exId,workItemId:String(l.workItemId||''),floor:l.floor||'عام',floorId:String(l.floorId||''),subLocId:String(l.subLocId||''),qty:+l.qty||0,price:+l.price||0,prevTranches:JSON.stringify(pt),currPct:0,notes:String(l.notes||''),adj:String(l.adj)==='TRUE'?'TRUE':'FALSE',adjRef:String(l.adjRef||''),adjWhy:String(l.adjWhy||''),files:'[]',parentId:String(d.id)});});
    }
    await batch.commit();pfToast('اتعمل مستخلص جاري ('+seq+') ✅',true);go(function(){openExtract(exId);});
  }catch(e){pfToast(e.message||('تعذّر: '+(e.code||'')),false);}
}
