<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Trust Group ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--red:#CE352F;--dark:#161616;--bg:#F4F2EF;--line:#E5E1DB;--muted:#8A857D;--green:#1F7A3D;--warn:#B3261E;--ink:#161616;
  --c-money:#C2410C;--c-work:#B45309;--c-people:#1D4ED8;--c-report:#047857;--c-admin:#6D28D9;
  --sh-sm:0 1px 2px rgba(22,22,22,.04),0 1px 3px rgba(22,22,22,.06);
  --sh-md:0 4px 12px rgba(22,22,22,.07),0 2px 4px rgba(22,22,22,.04);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,Arial,sans-serif;color:var(--dark);min-height:100vh;background:var(--bg);
  background-image:radial-gradient(1100px 520px at 88% -8%,rgba(206,53,47,.055),transparent 60%),radial-gradient(900px 460px at 5% 0%,rgba(31,122,61,.045),transparent 55%);background-attachment:fixed}
h1,h2,h3,.hd{font-family:Cairo}
#wm{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
#wm img{width:min(52vw,520px);opacity:.035;filter:grayscale(1)}
/* ===== Login ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
  background:linear-gradient(135deg,#161616,#0b2b24 60%,#0b4d3c)}
#login .box{background:#fff;border-radius:18px;padding:32px 28px;width:340px;box-shadow:0 20px 55px rgba(0,0,0,.35)}
#login img{height:54px;display:block;margin:0 auto 14px;background:#fff;border-radius:8px}
#login h1{font-family:Cairo;font-size:20px;text-align:center;color:var(--dark);margin-bottom:2px}
#login .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:18px}
#login label{font-size:12.5px;font-weight:700;display:block;margin:11px 0 4px}
#login input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:Tajawal;font-size:14px}
#login button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:var(--red);color:#fff;font-family:Cairo;font-size:15px;font-weight:700;cursor:pointer}
#login button:disabled{background:#c4ccd6}
#login .err{color:var(--red);font-size:12.5px;margin-top:11px;text-align:center;min-height:17px}
/* ===== App shell ===== */
#appRoot{display:none;position:relative;z-index:1}
.top{background:var(--dark);color:#fff;padding:8px 14px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tbrand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ttools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.top img{height:34px;background:#fff;border-radius:6px;padding:2px}
.top .hd{font-size:16px}
.top .ver{font-size:10px;color:#aaa;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:8px;padding:1px 7px}
.top .who{font-size:12.5px;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .lo{color:#F0A9A5;cursor:pointer;font-size:12.5px}
.nav{background:#2b2b2b;color:#ddd;border:1px solid #444;border-radius:8px;padding:4px 12px;font-family:Tajawal;font-size:12.5px;cursor:pointer;white-space:nowrap}
.nav:hover{background:#3a3a3a}
.navarrow{padding:4px 11px;font-size:16px;line-height:1;font-weight:700}
.nav:disabled{opacity:.35;cursor:default;background:#2b2b2b}
.clk{font-size:11.5px;color:#cfcfcf;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:8px;padding:2px 9px;white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 60px;position:relative;z-index:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--red);cursor:pointer;text-decoration:none;font-weight:700}
.rowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-family:Tajawal;font-size:14px;font-weight:700;cursor:pointer;background:var(--dark);color:#fff;box-shadow:var(--sh-sm)}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 15px 15px 17px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh-sm);transition:transform .16s,box-shadow .16s,border-color .16s}
.tile:before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--tc,var(--red));opacity:.85}
.tile .ti{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#F4F2EF;font-size:17px;margin-inline-end:9px;flex:none}
@supports (background:color-mix(in srgb,red 10%,#fff)){.tile .ti{background:color-mix(in srgb,var(--tc,var(--red)) 12%,#fff)}}
.tile .th{display:flex;align-items:center;gap:2px}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--muted)}
.tile:active{transform:translateY(0)}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--sh-sm)}
.stat .l{font-size:12px;color:var(--muted);margin-bottom:5px}
.stat .v{font-family:Cairo;font-size:22px;font-weight:800;color:var(--red);direction:ltr;text-align:right}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#faf8f5;border-bottom:2px solid var(--line);padding:9px 10px;text-align:right;font-size:12px;color:#555;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px}
.pill.on{background:#e6f4ea;color:var(--green)}.pill.off{background:#eef1f6;color:var(--muted)}
.live{font-size:11px;background:#e6f4ea;color:var(--green);padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-weight:700;vertical-align:middle;margin-inline-start:8px}
.live .dot{width:8px;height:8px;border-radius:50%;background:#1F7A3D}
.live .dot.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,122,61,.6)}100%{box-shadow:0 0 0 9px rgba(31,122,61,0)}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.ttools{width:100%;justify-content:space-between}.nav{flex:1}}
</style>
</head>

const $=s=>document.querySelector(s);
const el=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en');
let S={user:null};

/* ===== navigation history (رجوع / تقدّم) ===== */
let NAV=[],_navLock=false;
function navIdx(){return (history.state&&typeof history.state.i==='number')?history.state.i:-1;}
function go(fn){if(_navLock){fn();return;}const i=navIdx();NAV=NAV.slice(0,i+1);NAV.push(fn);try{history.pushState({i:NAV.length-1},'');}catch(e){}fn();}
function navReset(fn){NAV=[];try{history.replaceState({i:-1},'');}catch(e){}go(fn);}
function navBack(){try{history.back();}catch(e){}}
function navFwd(){try{history.forward();}catch(e){}}
function updNav(){const i=navIdx(),b=el('navBk'),f=el('navFw');if(b)b.disabled=(i<=0);if(f)f.disabled=(i>=NAV.length-1);}
window.addEventListener('popstate',function(e){const i=(e.state&&typeof e.state.i==='number')?e.state.i:0;const fn=NAV[i];if(fn){_navLock=true;try{fn();}catch(_){}_navLock=false;}});

/* ===== login ===== */
el('btnLogin').onclick=doLogin;
el('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function doLogin(){
  const em=el('email').value.trim(),pw=el('pass').value;
  if(!em||!pw){el('loginErr').textContent='اكتب البريد وكلمة المرور';return;}
  el('btnLogin').disabled=true;el('loginErr').textContent='';
  auth.signInWithEmailAndPassword(em,pw).catch(e=>{el('loginErr').textContent=authMsg(e.code);}).finally(()=>{el('btnLogin').disabled=false;});
}
function logout(){detachOps();auth.signOut();}
function authMsg(c){
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'البريد أو كلمة المرور غلط';
  if(c==='auth/invalid-email')return 'صيغة البريد غير صحيحة';
  if(c==='auth/too-many-requests')return 'محاولات كتير — استنى شوية';
  return 'تعذّر الدخول: '+c;
}
auth.onAuthStateChanged(u=>{
  if(u){S.user={email:u.email,name:(u.email||'').split('@')[0]};el('login').style.display='none';el('appRoot').style.display='block';clockStart();navReset(home);}

function finLoad(){

    FIN.cpay=r[3].docs.map(d=>d.data());FIN.clipay=r[4].docs.map(d=>d.data());
    FIN.projs=r[5].docs.map(d=>Object.assign({id:d.id},d.data()));FIN.users=r[6].docs.map(d=>Object.assign({id:d.id},d.data()));
    FIN.loaded=true;finCompute();finPaint();finPeriodLabel();
  }).catch(e=>{if(el('finBody'))el('finBody').innerHTML='<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر الحساب: '+esc(e.code||e.message)+'</div>';});

function finApply(){FIN.from=el('finFrom').value||'';FIN.to=el('finTo').value||'';finRecalc();}
function finMonth(){const f=new Date().toISOString().slice(0,7)+'-01',t=new Date().toISOString().slice(0,10);el('finFrom').value=f;el('finTo').value=t;FIN.from=f;FIN.to=t;finRecalc();}

function finRecalc(){if(!FIN.loaded)return;finCompute();finPaint();finPeriodLabel();}
function finPeriodLabel(){const l=el('finPeriod');if(l)l.textContent='الفترة: '+(FIN.from||'البداية')+' ← '+(FIN.to||'النهاردة')+(FIN.withSup?' · شاملة الإشراف':' · بدون الإشراف');}
function finCompute(){
  const f=FIN.from,t=FIN.to,withSup=FIN.withSup;
  const inR=d=>{d=String(d||'').slice(0,10);if(!d)return !f&&!t;if(f&&d<f)return false;if(t&&d>t)return false;return true;};
  const okD=(r,own)=>String(r.decDate||'').slice(0,10)||String(r[own]||'').slice(0,10);
  const spDone=r=>(String(r.st||'APPROVED'))==='APPROVED';
  const payOK=r=>String(r.void)!=='TRUE'&&((String(r.pst||'')||'APPROVED')==='APPROVED');
  const pn={},supP={};FIN.projs.forEach(p=>{pn[p.id]=p.name||'';if(String(p.supOnly)==='TRUE')supP[p.id]=1;});
  const skip=pid=>!withSup&&!!supP[String(pid||'')];
  const projCli={},cliProjs={};FIN.users.forEach(x=>{if(String(x.isClient)!=='TRUE'&&String(x.role)!=='client')return;let pj=[];try{pj=(JSON.parse(x.projIds||'[]')||[]).map(String);}catch(e){}cliProjs[x.id]=pj;pj.forEach(pid=>{if(!projCli[pid])projCli[pid]=x.id;});});
  const EX_FIN={CHAIRMAN_APPROVE:1,RECORD:1,CHAIRMAN_DIRECT:1};
  const fin={};FIN.appr.forEach(g=>{if(!EX_FIN[String(g.action||'')])return;const id=String(g.extractId||''),ts=String(g.timestamp||'').slice(0,10);if(id&&ts&&(!fin[id]||ts>fin[id]))fin[id]=ts;});
  const P={};const proj=pid=>{pid=String(pid||'');if(!P[pid])P[pid]={id:pid,name:pid?(pn[pid]||'؟'):'بدون عملية',cont:0,sup:0,cus:0,spend:0,coll:0};return P[pid];};
  const exp={contractors:0,suppliers:0,custody:0};
  const addExp=(cat,pid,v)=>{if(skip(pid))return;const pr=proj(pid);if(cat==='cont'){exp.contractors+=v;pr.cont+=v;}else if(cat==='sup'){exp.suppliers+=v;pr.sup+=v;}else{exp.custody+=v;pr.cus+=v;}pr.spend+=v;};
  FIN.ext.forEach(e=>{if(String(e.status)!=='FINAL')return;const d=fin[String(e.id)]||String(e.updatedAt||'').slice(0,10);if(!inR(d))return;const v=+e.netDue||0;if(!v)return;addExp('cont',e.projectId,v);});
  FIN.spend.forEach(r=>{const k=String(r.kind);if(k!=='sup'&&k!=='set')return;if(String(r.void)==='TRUE'||!spDone(r))return;const d=okD(r,'sdate');if(!inR(d))return;const v=+r.amount||0;if(!v)return;if(k==='sup')addExp('sup',r.projectId,v);else addExp('cus',r.projectId,v);});

function bkLog(m){const l=el('bkLog');if(l){l.innerHTML+=esc(m)+'<br>';l.scrollTop=l.scrollHeight;}}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function ensureXLSX(){return new Promise(function(res,rej){if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=function(){res();};s.onerror=function(){rej(new Error('تعذّر تحميل مكتبة Excel'));};document.head.appendChild(s);});}
async function backupDo(fmt){
  el('bkXlsx').disabled=true;el('bkJson').disabled=true;el('bkLog').innerHTML='';
  try{
    if(fmt==='xlsx')await ensureXLSX();
    const all={};let total=0;
    for(const pair of BK_COLLS){const en=pair[0],ar=pair[1];
      bkLog('بيقرا '+ar+'…');
      const s=await db.collection(en).get();
      all[en]=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      total+=all[en].length;
    }
    bkLog('إجمالي '+total.toLocaleString('en')+' سجل. بيجهّز الملف…');
    const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    if(fmt==='json'){
      dl(new Blob([JSON.stringify(all)],{type:'application/json'}),'TrustGroup_backup_'+stamp+'.json');
    }else{
      const wb=XLSX.utils.book_new();const used={};
      for(const pair of BK_COLLS){const en=pair[0];let ar=pair[1].slice(0,31);if(used[ar])ar=(en).slice(0,31);used[ar]=1;
        const rows=(all[en]||[]).map(r=>{const o=Object.assign({},r);if(en==='Attendance'&&o.selfie)o.selfie='[صورة]';return o;});
        const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}]);
        XLSX.utils.book_append_sheet(wb,ws,ar);
      }
      XLSX.writeFile(wb,'TrustGroup_backup_'+stamp+'.xlsx');
    }
    bkLog('✅ تم تجهيز الملف وبدأ التنزيل.');
  }catch(e){bkLog('✗ خطأ: '+(e.code||e.message));}
  el('bkXlsx').disabled=false;el('bkJson').disabled=false;
}

async function personSaveFb(id){
  const errEl=el('pf_err');if(errEl)errEl.textContent='';
  const nm=pfG('pf_name').trim();
  if(!nm){if(errEl)errEl.textContent='اكتب الاسم.';return;}
  let isSup=pfC('pf_isSup'),isSupVen=pfC('pf_isSupVen');
  let isClient=pfC('pf_isClient'),isContractor=pfC('pf_isContractor'),isVendor=pfC('pf_isVendor'),isHolder=pfC('pf_isHolder');
  let role=pfG('pf_role');
  if(isSup||isSupVen){isContractor=isSup;isVendor=isSupVen;isClient=false;isHolder=false;role='';}
  if(!role&&!isClient&&!isContractor&&!isVendor&&!isSup&&!isSupVen){if(errEl)errEl.textContent='اختار دور وظيفي أو صفة واحدة على الأقل.';return;}
  const nn=norm(nm);
  for(const u of PF.users){if(String(u.id)!==String(id)&&norm(u.name)===nn){if(errEl)errEl.textContent='فيه شخص تاني بنفس الاسم.';return;}}
  const uname=pfG('pf_username').trim();
  if(uname){const un=uname.toLowerCase();for(const u of PF.users){if(String(u.id)!==String(id)&&String(u.username||'').trim().toLowerCase()===un){if(errEl)errEl.textContent='اسم المستخدم «'+uname+'» محجوز لشخص تاني.';return;}}}
  const hasStaffRole=role&&['client','contractor','vendor'].indexOf(role)===-1;
  const allowZero=(isVendor&&pfC('pf_allowZero'));
  const tbVisible=(isContractor||isVendor);
  const job=(tbVisible?pfG('pf_job2'):pfG('pf_job')).trim();
  const projIds=[].slice.call(document.querySelectorAll('.pf_pj:checked')).map(e=>e.value);
  const sb=el('pf_save');if(sb){if(sb.disabled)return;sb.disabled=true;sb.textContent='⏳ بيحفظ…';}
  try{
    const existing=id?(PF.users.find(u=>String(u.id)===String(id))||null):null;
    const oldName=existing?String(existing.name||''):'';
    const recId=id||genId('u');
    const rec=Object.assign({},existing||{});
    rec.id=recId;
    if(!existing){rec.active='TRUE';rec.empId=rec.empId||'';rec.perms=rec.perms||'{}';rec.partnerShares=rec.partnerShares||'{}';}
    rec.name=nm;rec.role=role;
    rec.isClient=isClient?'TRUE':'FALSE';rec.isContractor=isContractor?'TRUE':'FALSE';rec.isVendor=isVendor?'TRUE':'FALSE';
    rec.allowZero=allowZero?'TRUE':'FALSE';rec.isSupVen=isSupVen?'TRUE':'FALSE';
    rec.phone=pfG('pf_phone');rec.nid=pfG('pf_nid');rec.address=pfG('pf_address');rec.notes=pfG('pf_notes');
    rec.job=job;rec.projIds=JSON.stringify(projIds);
    rec.contractorId=String(rec.contractorId||'');rec.supplierId=String(rec.supplierId||'');
    if(el('pf_mgr'))rec.managerId=pfG('pf_mgr');else rec.managerId=String(rec.managerId||'');
    rec.isHolder=isHolder?'TRUE':'FALSE';
    rec.username=uname;const pw=pfG('pf_password');if(pw)rec.password=pw;
    if(hasStaffRole){
      rec.basic=parseFloat(pfG('pf_basic'))||0;
      rec.confirmed=pfC('pf_confirmed')?'TRUE':'FALSE';rec.transport=pfC('pf_transport')?'TRUE':'FALSE';
      rec.exemptAtt=pfC('pf_exemptAtt')?'TRUE':'FALSE';rec.unlimLeave=pfC('pf_unlimLeave')?'TRUE':'FALSE';
      rec.repDuty=pfC('pf_repDuty')?'TRUE':'FALSE';
      rec.balReg=parseFloat(pfG('pf_balReg'))||0;rec.balCas=parseFloat(pfG('pf_balCas'))||0;
      rec.bank=pfG('pf_bank');rec.policy=pfG('pf_policy')||'site';
      rec.tIn=pfG('pf_tIn');rec.tOut=pfG('pf_tOut');
      rec.twoShift=pfC('pf_twoShift')?'TRUE':'FALSE';rec.tIn2=pfG('pf_tIn2');rec.tOut2=pfG('pf_tOut2');
    }
    const batch=db.batch();
    // Contractors — صف للمقاول (يحمل علامة مقاول إشراف والأعمال)
    if(isContractor){
      let ctId=String(rec.contractorId||'');
      let ctDoc=ctId?PF.contractors.find(c=>String(c.id)===ctId):null;
      if(!ctId){const ex=PF.contractors.find(c=>String(c.archived)!=='TRUE'&&norm(c.name)===nn);
        if(ex){ctId=String(ex.id);ctDoc=ex;}else{ctId=genId('ct');ctDoc=null;}rec.contractorId=ctId;}
      const cref=db.collection('Contractors').doc(ctId);
      if(ctDoc){const upd={};if(String(ctDoc.name)!==nm)upd.name=nm;if(String(ctDoc.trade||'')!==job)upd.trade=job;
        const ws=isSup?'TRUE':'FALSE';if(String(ctDoc.isSup||'FALSE')!==ws)upd.isSup=ws;
        if(Object.keys(upd).length)batch.set(cref,upd,{merge:true});}
      else{batch.set(cref,{id:ctId,name:nm,phone:rec.phone||'',trade:job||'',nid:rec.nid||'',address:rec.address||'',notes:'',files:'[]',typeIds:'[]',archived:'FALSE',isSup:isSup?'TRUE':'FALSE'});}
    }
    // Holders — صف لحامل العهدة
    if(isHolder){
      let hdId=String(rec.holderId||'');
      if(!hdId){const ex=PF.holders.find(h=>norm(h.name)===nn);
        if(ex)hdId=String(ex.id);else{hdId=genId('hd');batch.set(db.collection('Holders').doc(hdId),{id:hdId,name:nm,phone:rec.phone||'',archived:'FALSE',isArchiveOnly:'FALSE',notes:''});}}
      else{const ex=PF.holders.find(h=>String(h.id)===hdId);if(ex&&String(ex.name)!==nm)batch.set(db.collection('Holders').doc(hdId),{name:nm},{merge:true});}
      rec.holderId=hdId;
    }else{rec.holderId='';}
    // Suppliers — مزامنة الاسم عند التغيير فقط (زي القديم)
    if(existing&&oldName&&norm(oldName)!==nn&&String(rec.supplierId||'')){
      const sx=PF.suppliers.find(s=>String(s.id)===String(rec.supplierId));
      if(sx&&String(sx.name)!==nm)batch.set(db.collection('Suppliers').doc(String(rec.supplierId)),{name:nm},{merge:true});
    }
    batch.set(db.collection('Users').doc(recId),rec);
    await batch.commit();
    let renamed=0;
    if(existing&&oldName&&norm(oldName)!==nn)renamed=await propagateRename(recId,oldName,nm);
    pfToast('اتحفظ ✅'+(renamed?(' · تحدّث '+renamed+' حركة'):''),true);
    navBack();
  }catch(e){
    if(errEl)errEl.textContent='تعذّر الحفظ: '+(e.code||e.message||e);
    const s2=el('pf_save');if(s2){s2.disabled=false;s2.textContent='💾 حفظ';}
  }
}
async function propagateRename(recId,oldName,nm){
  const refs=[],seen={};
  try{const s1=await db.collection('Spend').where('partyId','==',recId).get();s1.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;refs.push(d.ref);}});}catch(e){}
  try{const s2=await db.collection('Spend').where('vendorName','==',oldName).get();s2.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;refs.push(d.ref);}});}catch(e){}
  let n=0;
  for(let i=0;i<refs.length;i+=400){const b=db.batch();refs.slice(i,i+400).forEach(ref=>b.set(ref,{vendorName:nm,partyId:recId},{merge:true}));await b.commit();n+=Math.min(400,refs.length-i);}
  return n;
}

let REF={types:null,contractors:null,usersById:null,projects:null};
function loadRefs(){
  const need=[];
  if(!REF.types)need.push(db.collection('Types').get().then(s=>{REF.types={};s.forEach(d=>REF.types[d.id]=(d.data().name||d.id));}));
  if(!REF.contractors)need.push(db.collection('Contractors').get().then(s=>{REF.contractors={};s.forEach(d=>REF.contractors[d.id]=(d.data().name||d.id));}));
  if(!REF.usersById)need.push(db.collection('Users').get().then(s=>{REF.usersById={};s.forEach(d=>REF.usersById[d.id]=(d.data().name||d.id));}));
  if(!REF.projects)need.push(db.collection('Projects').get().then(s=>{REF.projects={};s.forEach(d=>REF.projects[d.id]=(d.data().name||d.id));}));
  return Promise.all(need);
}

  const tn=id=>(REF.types&&REF.types[id])||id||'—';
  const en=id=>(REF.usersById&&REF.usersById[id])||id||'—';
  const ext=PRJ.ext.slice().sort((a,b)=>String(a.contractorId||'').localeCompare(String(b.contractorId||''))||(+a.seq||0)-(+b.seq||0));
  let totNet=0,totVal=0;ext.forEach(e=>{totNet+=+e.netDue||0;totVal+=+e.totalValue||0;});
  let payTot=0;PRJ.pay.forEach(x=>{if(String(x.pst||x.status||'')==='APPROVED')payTot+=+x.amount||0;});
  const arch=String(p.archived)==='TRUE';
  let h='<div class="card"><h3 style="margin:0">🏗️ '+esc(p.name||'—')+' <span class="live"><span class="dot" id="liveDot"></span> لحظي</span></h3>'+
    '<div class="muted" style="margin-top:3px">'+(p.location?esc(p.location)+' · ':'')+(arch?'مؤرشفة':'نشطة')+'</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="l">المستخلصات</div><div class="v">'+ext.length+'</div></div>'+
      '<div class="stat"><div class="l">إجمالي قيمة المستخلصات</div><div class="v">'+fmt(totVal)+' <small>ج</small></div></div>'+
      '<div class="stat"><div class="l">صافي المستخلصات</div><div class="v">'+fmt(totNet)+' <small>ج</small></div></div>'+
      '<div class="stat"><div class="l">دفعات العملاء (معتمدة)</div><div class="v">'+fmt(payTot)+' <small>ج</small></div></div>'+
    '</div>'+
    '<h3 style="margin:14px 0 8px;font-size:15px">📐 المستخلصات</h3><div class="card" style="padding:0;overflow:auto"><table>'+
    '<thead><tr><th>م</th><th>المقاول</th><th>نوع الأعمال</th><th>المهندس</th><th>الحالة</th><th>الإجمالي</th><th>السابق</th><th>الصافي</th><th>التاريخ</th></tr></thead><tbody>'+
    (ext.map(e=>'<tr>'+
      '<td class="num">'+esc(e.seq||'')+'</td>'+
      '<td><b>'+esc(cn(e.contractorId))+'</b></td>'+
      '<td style="font-size:12.5px">'+esc(tn(e.typeId))+'</td>'+
      '<td style="font-size:12px">'+esc(en(e.engineerId))+'</td>'+
      '<td>'+extPill(e.status)+'</td>'+
      '<td class="num">'+fmt(e.totalValue)+'</td>'+
      '<td class="num">'+fmt(e.prevValue)+'</td>'+
      '<td class="num"><b>'+fmt(e.netDue)+'</b></td>'+
      '<td style="font-size:11.5px;direction:ltr;text-align:left">'+esc(String(e.createdAt||'').slice(0,10))+'</td>'+
    '</tr>').join('')||'<tr><td colspan="9" class="muted" style="padding:16px;text-align:center">لا توجد مستخلصات</td></tr>')+
    '</tbody></table></div>'+
    '<h3 style="margin:14px 0 8px;font-size:15px">💰 دفعات العملاء</h3><div class="card" style="padding:0;overflow:auto"><table>'+
    '<thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>رقم الإيصال</th><th>الحالة</th></tr></thead><tbody>'+
    (PRJ.pay.slice().sort((a,b)=>String(b.pdate||'').localeCompare(String(a.pdate||''))).map(x=>'<tr>'+
      '<td style="direction:ltr;text-align:right">'+esc(x.pdate||'—')+'</td>'+
      '<td class="num">'+fmt(x.amount)+' ج</td>'+
      '<td style="font-size:12px">'+esc(x.method||'—')+'</td>'+
      '<td style="font-size:12px">'+esc(x.receiptNo||'—')+'</td>'+
      '<td>'+(String(x.pst||x.status||'')==='APPROVED'?'<span class="pill on">معتمدة</span>':'<span class="pill off">'+esc(x.pst||x.status||'—')+'</span>')+'</td>'+
    '</tr>').join('')||'<tr><td colspan="5" class="muted" style="padding:16px;text-align:center">لا توجد دفعات</td></tr>')+
    '</tbody></table></div>';
  el('prjBody').innerHTML=h;
}

/* ===== العمليات والعملاء — لحظي ===== */
let opsUnsub=[],projects=[],extracts=[],pays=[];
function detachOps(){opsUnsub.forEach(u=>{try{u()}catch(e){}});opsUnsub=[];}
function flashLive(){const d=el('liveDot');if(!d)return;d.classList.remove('pulse');void d.offsetWidth;d.classList.add('pulse');}
function openOpsHome(){
  detachOps();projects=[];extracts=[];pays=[];
  const html='<h3 style="margin-bottom:12px">🏗️ العمليات والعملاء <span class="live"><span class="dot" id="liveDot"></span> لحظي</span></h3>'+
    '<div class="stats">'+
      '<div class="stat"><div class="l">العمليات</div><div class="v" id="sProj">—</div></div>'+
      '<div class="stat"><div class="l">المستخلصات</div><div class="v" id="sExt">—</div></div>'+
      '<div class="stat"><div class="l">إجمالي صافي المستخلصات</div><div class="v" id="sNet">—</div></div>'+
      '<div class="stat"><div class="l">دفعات العملاء (معتمدة)</div><div class="v" id="sPay">—</div></div>'+
    '</div>'+
    '<div class="card" style="padding:0;overflow:hidden"><table>'+
      '<thead><tr><th>العملية</th><th>الموقع</th><th>الحالة</th><th>عدد المستخلصات</th><th>صافي المستخلصات</th><th>دفعات العملاء</th></tr></thead>'+
      '<tbody id="opsRows"><tr><td colspan="6" style="text-align:center;color:var(--muted);padding:34px">جاري التحميل اللحظي…</td></tr></tbody>'+
    '</table></div>'+
    '<p class="muted" style="margin-top:9px">البيانات بتتحدّث لحظياً — أي تغيير في قاعدة البيانات بيظهر هنا فوراً.</p>';
  shell(html,crumbHome('العمليات والعملاء'));
  opsUnsub.push(db.collection('Projects').onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));renderOps();flashLive();},e=>opsErr(e)));
  opsUnsub.push(db.collection('Extracts').onSnapshot(s=>{extracts=s.docs.map(d=>d.data());renderOps();flashLive();},e=>opsErr(e)));
  opsUnsub.push(db.collection('ClientPayments').onSnapshot(s=>{pays=s.docs.map(d=>d.data());renderOps();flashLive();},e=>opsErr(e)));
}
function opsErr(e){const tb=el('opsRows');if(tb)tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--red);padding:24px">تعذّر تحميل البيانات: '+esc(e.code||e.message)+'</td></tr>';}
function renderOps(){
  if(!el('opsRows'))return;
  const exByP={},netByP={},payByP={};let totalNet=0,totalPay=0;
  extracts.forEach(e=>{const p=e.projectId||'—';exByP[p]=(exByP[p]||0)+1;const v=+e.netDue||0;netByP[p]=(netByP[p]||0)+v;totalNet+=v;});
  pays.forEach(p=>{if(String(p.pst||p.status||'')!=='APPROVED')return;const v=+p.amount||0;const pr=p.projectId||'';if(pr)payByP[pr]=(payByP[pr]||0)+v;totalPay+=v;});
  const act=projects.filter(p=>String(p.archived)!=='TRUE').length;
  if(el('sProj'))el('sProj').innerHTML=act+' <small>/ '+projects.length+'</small>';
  if(el('sExt'))el('sExt').textContent=extracts.length.toLocaleString('en');
  if(el('sNet'))el('sNet').innerHTML=fmt(totalNet)+' <small>ج</small>';
  if(el('sPay'))el('sPay').innerHTML=fmt(totalPay)+' <small>ج</small>';
  const rows=projects.slice().sort((a,b)=>String(a.archived).localeCompare(String(b.archived))||(a.name||'').localeCompare(b.name||'','ar'));
  const tb=el('opsRows');
  if(!rows.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">لا توجد عمليات.</td></tr>';return;}
  tb.innerHTML=rows.map(p=>{const arch=String(p.archived)==='TRUE';const pid=String(p.id).replace(/[^A-Za-z0-9_-]/g,'');return '<tr style="cursor:pointer" title="اضغط لتفاصيل العملية" onclick="go(function(){openProject(\''+pid+'\')})">'+
    '<td><b>'+esc(p.name||'—')+'</b> <span style="color:var(--muted);font-size:11px">›</span></td>'+
    '<td>'+esc(p.location||'—')+'</td>'+
    '<td>'+(arch?'<span class="pill off">مؤرشفة</span>':'<span class="pill on">نشطة</span>')+'</td>'+
    '<td class="num">'+((exByP[p.id]||0).toLocaleString('en'))+'</td>'+
    '<td class="num">'+fmt(netByP[p.id]||0)+' ج</td>'+
    '<td class="num">'+fmt(payByP[p.id]||0)+' ج</td></tr>';}).join('');
}
</script>
</body>
</html>
