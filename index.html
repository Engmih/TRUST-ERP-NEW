<style>
:root{--red:#CE352F;--dark:#161616;--bg:#E6F6EB;--line:#E5E1DB;--muted:#8A857D;--green:#1F7A3D;--warn:#B3261E;--ink:#161616;
  --c-money:#C2410C;--c-work:#B45309;--c-people:#1D4ED8;--c-report:#047857;--c-admin:#6D28D9;
  --sh-sm:0 1px 2px rgba(22,22,22,.04),0 1px 3px rgba(22,22,22,.06);
  --sh-md:0 4px 12px rgba(22,22,22,.07),0 2px 4px rgba(22,22,22,.04);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,Arial,sans-serif;color:var(--dark);min-height:100vh;background:var(--bg);
  background-image:radial-gradient(1100px 520px at 88% -8%,rgba(206,53,47,.055),transparent 60%),radial-gradient(900px 460px at 5% 0%,rgba(31,122,61,.045),transparent 55%);background-attachment:fixed}
h1,h2,h3,.hd{font-family:Cairo}
input,select,textarea,button{font-family:Tajawal,Arial,sans-serif}
input[type=number]{font-variant-numeric:tabular-nums}
#wm{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
#wm img{width:min(52vw,520px);opacity:.035;filter:grayscale(1)}
/* ===== Login ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
  background:linear-gradient(135deg,#161616,#0b2b24 60%,#0b4d3c)}
#login .box{background:#fff;border-radius:18px;padding:32px 28px;width:340px;box-shadow:0 20px 55px rgba(0,0,0,.35)}
#login img{height:54px;display:block;margin:0 auto 14px;background:#fff;border-radius:8px}
#login h1{font-family:Cairo;font-size:20px;text-align:center;color:var(--dark);margin-bottom:2px}
#login .sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:18px}
#login label{font-size:12.5px;font-weight:700;display:block;margin:11px 0 4px}
#login input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:Tajawal;font-size:14px}
#login button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:11px;background:var(--red);color:#fff;font-family:Cairo;font-size:15px;font-weight:700;cursor:pointer}
#login button:disabled{background:#c4ccd6}
#login .err{color:var(--red);font-size:12.5px;margin-top:11px;text-align:center;min-height:17px}
/* ===== App shell ===== */
#appRoot{display:none;position:relative;z-index:1}
.top{background:var(--dark);color:#fff;padding:8px 14px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tbrand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ttools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.top img{height:34px;background:#fff;border-radius:6px;padding:2px}
.top .hd{font-size:16px}
.top .ver{font-size:10px;color:#aaa;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:8px;padding:1px 7px}
.top .who{font-size:12.5px;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .lo{color:#F0A9A5;cursor:pointer;font-size:12.5px}
.nav{background:#2b2b2b;color:#ddd;border:1px solid #444;border-radius:8px;padding:4px 12px;font-family:Tajawal;font-size:12.5px;cursor:pointer;white-space:nowrap}
.nav:hover{background:#3a3a3a}
.navarrow{padding:4px 11px;font-size:16px;line-height:1;font-weight:700}
.nav:disabled{opacity:.35;cursor:default;background:#2b2b2b}
.clk{font-size:11.5px;color:#cfcfcf;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:8px;padding:2px 9px;white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 60px;position:relative;z-index:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--red);cursor:pointer;text-decoration:none;font-weight:700}
.rowline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.frm label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px;color:var(--dark);line-height:1.5}
.frm input,.frm select,.frm textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:Tajawal,Arial,sans-serif;font-size:14px;background:#fff;box-sizing:border-box;color:var(--dark)}
.frm input:focus,.frm select:focus,.frm textarea:focus{outline:none;border-color:var(--red)}
.frm input[type=checkbox],.frm input[type=radio]{width:auto;margin:0;accent-color:var(--red)}
.frm .rowline>div>label{margin-top:0}
.frm label[style*="flex"]{margin:0;font-weight:500}
.muted{color:var(--muted);font-size:12px}
.btn{border:none;border-radius:10px;padding:9px 16px;font-family:Tajawal;font-size:14px;font-weight:700;cursor:pointer;background:var(--dark);color:#fff;box-shadow:var(--sh-sm)}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 15px 15px 17px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh-sm);transition:transform .16s,box-shadow .16s,border-color .16s}
.tile:before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--tc,var(--red));opacity:.85}
.tile .ti{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#F4F2EF;font-size:17px;margin-inline-end:9px;flex:none}
@supports (background:color-mix(in srgb,red 10%,#fff)){.tile .ti{background:color-mix(in srgb,var(--tc,var(--red)) 12%,#fff)}}
.tile .th{display:flex;align-items:center;gap:2px}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--muted)}
.tile:active{transform:translateY(0)}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--sh-sm)}
.stat .l{font-size:12px;color:var(--muted);margin-bottom:5px}
.stat .v{font-family:Cairo;font-size:22px;font-weight:800;color:var(--red);direction:ltr;text-align:right}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#faf8f5;border-bottom:2px solid var(--line);padding:9px 10px;text-align:right;font-size:12px;color:#555;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:left}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px}
.pill.on{background:#e6f4ea;color:var(--green)}.pill.off{background:#eef1f6;color:var(--muted)}
.live{font-size:11px;background:#e6f4ea;color:var(--green);padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-weight:700;vertical-align:middle;margin-inline-start:8px}
.live .dot{width:8px;height:8px;border-radius:50%;background:#1F7A3D}
.live .dot.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,122,61,.6)}100%{box-shadow:0 0 0 9px rgba(31,122,61,0)}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.ttools{width:100%;justify-content:space-between}.nav{flex:1}}
</style>
</head>

/* ===== navigation history (رجوع / تقدّم) ===== */
let NAV=[],_navLock=false;
function navIdx(){return (history.state&&typeof history.state.i==='number')?history.state.i:-1;}
function go(fn){if(_navLock){fn();return;}const i=navIdx();NAV=NAV.slice(0,i+1);NAV.push(fn);try{history.pushState({i:NAV.length-1},'');}catch(e){}fn();}
function navReset(fn){NAV=[];try{history.replaceState({i:-1},'');}catch(e){}go(fn);}
function navBack(){try{history.back();}catch(e){}}
function navFwd(){try{history.forward();}catch(e){}}
function updNav(){const i=navIdx(),b=el('navBk'),f=el('navFw');if(b)b.disabled=(i<=0);if(f)f.disabled=(i>=NAV.length-1);}
window.addEventListener('popstate',function(e){const i=(e.state&&typeof e.state.i==='number')?e.state.i:0;const fn=NAV[i];if(fn){_navLock=true;try{fn();}catch(_){}_navLock=false;}});

/* ===== login ===== */
el('btnLogin').onclick=doLogin;
el('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function doLogin(){
  const em=el('email').value.trim(),pw=el('pass').value;
  if(!em||!pw){el('loginErr').textContent='اكتب البريد وكلمة المرور';return;}
  el('btnLogin').disabled=true;el('loginErr').textContent='';
  auth.signInWithEmailAndPassword(em,pw).catch(e=>{el('loginErr').textContent=authMsg(e.code);}).finally(()=>{el('btnLogin').disabled=false;});
}
function logout(){detachOps();auth.signOut();}
/* إنشاء حساب دخول في Firebase من داخل البرنامج — بنسخة ثانية عشان ماتطلّعش المستخدم الحالي من جلسته */
let _secApp=null;
function secAuth(){if(!_secApp){try{_secApp=firebase.initializeApp(firebaseConfig,'secondary');}catch(e){_secApp=firebase.app('secondary');}}return _secApp.auth();}
async function createAuthUser(email,password){
  email=String(email||'').trim().toLowerCase();password=String(password||'');
  if(!email||!password)return {ok:false,code:'missing'};
  if(password.length<6)return {ok:false,code:'weak'};
  const a=secAuth();

async function bulkLoginsRun(){
  if(!meChair())return;const targets=BL.targets||[];if(!targets.length){pfToast('مفيش حد للنشر',false);return;}
  const b=el('blGo');if(b){b.disabled=true;b.textContent='⏳ بينشر…';}
  let ok=0,exist=0,fail=0;const res=[['الاسم','الدور','الإيميل','الباسورد','الحالة']];const prog=el('blProg');
  for(let i=0;i<targets.length;i++){const u=targets[i];const email=blEmail(u),pass=blPass(u);
    if(prog)prog.textContent='('+(i+1)+'/'+targets.length+') '+(u.name||u.id)+' …';
    let r=await createAuthUser(email,pass);
    if(!r.ok&&r.code==='auth/too-many-requests'){await new Promise(z=>setTimeout(z,8000));r=await createAuthUser(email,pass);}
    let st='';
    if(r.ok){try{await db.collection('Users').doc(String(u.id)).set({email:email},{merge:true});}catch(e){}ok++;st='✅ اتعمل';}
    else if(r.code==='auth/email-already-in-use'){try{await db.collection('Users').doc(String(u.id)).set({email:email},{merge:true});}catch(e){}exist++;st='موجود (اتربط)';}
    else{fail++;st='✗ '+authErrAr(r.code);}
    res.push([u.name||'',ROLES_[u.role]||u.role||'',email,pass,st]);
    await new Promise(z=>setTimeout(z,350));
  }
  if(prog)prog.innerHTML='<b style="color:#1F7A3D">خلص ✅</b> — اتعمل '+ok+' · موجود '+exist+' · فشل '+fail;
  if(b){b.disabled=false;b.textContent='🚀 ابدأ النشر';}

  const csv='﻿'+res.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  dl(new Blob([csv],{type:'text/csv'}),'login_accounts_'+today10Fb()+'.csv');
  pfToast('اتنشر '+(ok+exist)+' حساب ✅'+(fail?' · فشل '+fail:''),true);
}

/* تحديد المستخدم الحالي ودوره من جدول Users — الربط بالإيميل ثم اسم المستخدم فقط (لا fallback للرئيس) */
function resolveMe(){
  return Promise.all([db.collection('Users').get(),db.collection('Employees').get().catch(()=>({docs:[]}))]).then(r=>{
    const us=r[0].docs.map(d=>({id:d.id,...d.data()}));
    const emps=r[1].docs.map(d=>({id:d.id,...d.data()}));
    const email=(S.user.email||'').toLowerCase(),local=email.split('@')[0];
    let me=us.find(u=>String(u.email||'').toLowerCase()===email&&email)||us.find(u=>String(u.username||'').toLowerCase()===local&&local);
    if(me&&String(me.active)==='FALSE')me=null; /* المتوقف أو المدموج ما يدخلش */
    if(me){S.user.id=String(me.id);S.user.role=String(me.role||'');S.user.holderId=String(me.holderId||'');if(me.name)S.user.name=String(me.name);let px={};try{px=JSON.parse(me.perms||'{}')||{};}catch(e){}S.user.perms=px;
      /* ربط سجل الموظف — بالـ empId أو بالـ userId (مطابق empByUser_ في القديم): هو ده اللي بيحدد «مربوط بالحضور» */
      const emp=emps.find(e=>String(e.id)===String(me.empId||'')||String(e.userId)===String(me.id));
      S.user.empId=emp?String(emp.id):String(me.empId||'');
      S.user.linked=!!emp;                                    /* att.linked: عنده سجل موظف = بيبصم ويقدّم طلبات */
      S.user.myManagerId=emp?String(emp.managerId||''):'';    /* مديري المباشر — طلباتي بتروح له الأول */
      const myEmp=S.user.empId;
      S.user.isManager=!!myEmp&&emps.some(e=>String(e.managerId)===String(myEmp)&&String(e.active)!=='FALSE'); /* عنده فريق */
      S.user.isClient=String(me.isClient)==='TRUE';S.user.isContractor=String(me.isContractor)==='TRUE';S.user.isVendor=String(me.isVendor)==='TRUE';S.user.matched=true;}
    else{S.user.matched=false;}
  }).catch(()=>{S.user.matched=false;});
}

function payStartFb(){return meChair()?'PEND_ACC':'PEND_CHAIR';}
function payStageFb(pst,isCli){pst=String(pst||'APPROVED');if(pst==='PEND_CHAIR')return meChair()?'chair':'';if(pst==='PEND_ACC'&&!isCli)return meAcc()?'acc':'';return '';}
const PAY_ST_AR_FB={PEND_CHAIR:'قيد اعتماد الرئيس',PEND_ACC:'قيد مراجعة الحسابات',RETURNED:'مُرجَعة للتعديل',APPROVED:'معتمدة',REJECTED:'مرفوضة'};
function payStPill(pst){const x=PAY_ST_AR_FB[pst]||pst||'معتمدة';const c=(pst==='APPROVED'||!pst)?['#EAF3DE','#27500A']:((pst==='RETURNED'||pst==='REJECTED')?['#FBE3E1','#8E2620']:['#FFF4E0','#B26A00']);return '<span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+esc(x)+'</span>';}
function custCalc(hid,uid,d){
  let adv=0,spent=0,pend=0,paidOut=0;const rows=[];
  const isPendSp=st=>SP_PEND_.indexOf(st)!==-1||st==='RETURNED';
  const isPendPay=p=>(p==='PEND_CHAIR'||p==='PEND_ACC'||p==='RETURNED');
  (d.spend||[]).forEach(r=>{if(String(r.void)==='TRUE')return;const v=+r.amount||0,st=String(r.st||'APPROVED'),k=String(r.kind);
    const mine=String(r.holderId)===String(hid),fromMe=String(r.fromHolderId||'')===String(hid);if(!mine&&!fromMe)return;
    if(mine&&k==='adv'){let bk='';if(st==='APPROVED'){adv+=v;bk='in';}else if(isPendSp(st)){pend+=v;bk='pend';}
      rows.push({date:r.sdate,kind:String(r.fromHolderId||'')?'عهدة واردة':'تغذية',proj:r.projectId,amount:v,notes:r.notes||r.itemText||'',st:st,bk:bk});return;}
    if(fromMe&&k==='adv'){let bk='';if(st==='APPROVED'){paidOut+=v;bk='out';}else if(isPendSp(st)){pend+=v;bk='pend';}
      rows.push({date:r.sdate,kind:'عهدة صادرة',proj:r.projectId,amount:-v,notes:r.notes||r.itemText||'',st:st,bk:bk});return;}
    if(!mine)return;let bk='';if(st==='APPROVED'){spent+=v;bk='spent';}else if(isPendSp(st)){pend+=v;bk='pend';}
    rows.push({date:r.sdate,kind:'صرف',proj:r.projectId,amount:-v,notes:r.notes||r.itemText||'',st:st,bk:bk,id:r.id,ret:(st==='RETURNED')});});
  (d.cpay||[]).forEach(r=>{if(String(r.void)==='TRUE'||String(r.fromHolderId||'')!==String(hid))return;const v=+r.amount||0,p=String(r.pst||'APPROVED');let bk='';if(p==='APPROVED'){paidOut+=v;bk='out';}else if(isPendPay(p)){pend+=v;bk='pend';}
    rows.push({date:r.date,kind:'دفعة',proj:r.projectId,amount:-v,notes:(r.notes||'')+' — لـ '+(d.names[String(r.partyId)]||'—'),st:p,bk:bk});});
  if(uid)(d.clipay||[]).forEach(r=>{if(String(r.void)==='TRUE'||String(r.byId||'')!==String(uid))return;const v=+r.amount||0,p=String(r.pst||r.status||'APPROVED');let bk='';if(p==='APPROVED'){adv+=v;bk='in';}else if(isPendPay(p)){pend+=v;bk='pend';}
    rows.push({date:r.pdate,kind:'تحصيل',proj:r.projectId,amount:v,notes:(r.descr||'')+' — من '+(d.names[String(r.clientId)]||'عميل'),st:p,bk:bk});});
  (d.salpay||[]).forEach(r=>{if(String(r.void)==='TRUE'||String(r.holderId||'')!==String(hid))return;const v=+r.amount||0;paidOut+=v;
    rows.push({date:String(r.ts||'').slice(0,10),kind:'صرف مرتب',proj:'',amount:-v,notes:String(r.empName||'')+' ('+String(r.month||'')+')',st:'APPROVED',bk:'out'});});
  rows.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  return {adv:adv,spent:spent,pend:pend,paidOut:paidOut,balance:adv-spent-paidOut,rows:rows};
}
let CS={hid:'',uid:'',name:'',mine:false,data:null,projs:{},bucket:'',holders:[],parties:[]};
function custView(hid,uid,name,mine,crumb){
  detachOps();CS={hid:hid,uid:uid,name:name,mine:mine,data:null,projs:{},bucket:'',holders:[],parties:[]};CS.crumb=crumb;
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري تحميل الكشف…</div>',crumb);
  Promise.all([
    db.collection('Projects').get(),
    db.collection('Users').get(),
    db.collection('Holders').get().catch(()=>({docs:[]})),
    db.collection('Spend').where('holderId','==',hid).get().catch(()=>({docs:[]})),
    db.collection('Spend').where('fromHolderId','==',hid).get().catch(()=>({docs:[]})),
    db.collection('ContractorPayments').where('fromHolderId','==',hid).get().catch(()=>({docs:[]})),
    uid?db.collection('ClientPayments').where('byId','==',uid).get().catch(()=>({docs:[]})):Promise.resolve({docs:[]}),
    db.collection('SalPayments').where('holderId','==',hid).get().catch(()=>({docs:[]}))
  ]).then(r=>{
    CS.projs={};r[0].docs.forEach(d=>CS.projs[d.id]=(d.data().name||d.id));
    const users=r[1].docs.map(d=>({id:d.id,...d.data()}));
    const names={};users.forEach(u=>names[u.id]=u.name||'');
    CS.holders=r[2].docs.map(d=>({id:d.id,...d.data()})).filter(h=>String(h.archived)!=='TRUE');
    r[2].docs.forEach(d=>{names[d.id]=d.data().name||names[d.id]||'';});
    CS.parties=users.filter(u=>String(u.isContractor)==='TRUE'||String(u.isVendor)==='TRUE').map(u=>({id:u.id,name:u.name||'',contractorId:u.contractorId||'',isSupVen:String(u.isSupVen)==='TRUE'}));
    const spMap={};r[3].docs.forEach(d=>spMap[d.id]={id:d.id,...d.data()});r[4].docs.forEach(d=>spMap[d.id]={id:d.id,...d.data()});
    const data={spend:Object.values(spMap),cpay:r[5].docs.map(d=>({id:d.id,...d.data()})),clipay:r[6].docs.map(d=>({id:d.id,...d.data()})),salpay:r[7].docs.map(d=>({id:d.id,...d.data()})),names:names};
    CS.data=custCalc(hid,uid,data);
    custPaint();
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumb));
}

async function ord2Advance(id){
  const o=OV.o;if(!o||String(o.id)!==String(id))return;if(!ordActorOk(o)){pfToast('مش دورك في المرحلة دي',false);return;}
  const st=String(o.status),next=ordNextSt(o);if(!next){pfToast('مفيش مرحلة تانية',false);return;}
  const batch=db.batch();let total=0;
  try{
    if(st==='P_REQ'){
      for(const l of OV.lines){const v=((el('ovv_'+l.id)||{}).value||'').trim(),p=parseFloat((el('ovp_'+l.id)||{}).value)||0,q=parseFloat((el('ovq_'+l.id)||{}).value);const qty=isNaN(q)?(+l.qtyReq||0):q;
        if(!v){pfToast('كل بند لازم مورد',false);return;}
        const sup=OV.sups.find(s=>norm(s.name)===norm(v))||{};const zOk=String(sup.isSupVen)==='TRUE'||String(sup.allowZero)==='TRUE'||isRetOf(o);
        if(!(p>0)&&!zOk){pfToast('كل بند لازم سعر (أو مورد يسمح بصفر)',false);return;}
        const amt=Math.round(p*qty*(isRetOf(o)?-1:1)*100)/100;total+=amt;
        batch.set(db.collection('OrderLines').doc(String(l.id)),{vendorName:v,price:p,qtyGot:qty,amount:amt},{merge:true});}
    } else if(st==='E_QTY'){
      for(const l of OV.lines){const q=parseFloat((el('ovq_'+l.id)||{}).value);const qty=isNaN(q)?(+l.qtyGot||+l.qtyReq||0):q;
        if(qty>(+l.qtyReq||0)+1e-9){pfToast('المستلم أكتر من المطلوب في بند',false);return;}
        const amt=Math.round((+l.price||0)*qty*(isRetOf(o)?-1:1)*100)/100;total+=amt;
        batch.set(db.collection('OrderLines').doc(String(l.id)),{qtyGot:qty,amount:amt},{merge:true});}
    } else {OV.lines.forEach(l=>total+=(+l.amount||0));}
    if(next==='DONE'){await ordFinalize(id,batch,total);return;}
    const vendUpd=st==='P_REQ'?{vendorName:(OV.lines.map(l=>((el('ovv_'+l.id)||{}).value||'').trim()).filter(Boolean)[0]||'')}:{};
    batch.set(db.collection('Orders').doc(id),Object.assign({status:next,amount:Math.round(total*100)/100,decNote:''},vendUpd),{merge:true});
    const lid=genId('log');batch.set(db.collection('ApprovalsLog').doc(lid),{id:lid,extractId:id,action:'ORD_STEP_'+st,byName:S.user.name||'',notes:(ORD_AR[st]||st)+' ← '+(ORD_AR[next]||next),timestamp:nowIsoFb()});
    await batch.commit();pfToast('اترفعت للمرحلة التالية ✅ — '+(ORD_AR[next]||next),true);ordView(id);
  }catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}

     (صفة الإشراف على العملية نفسها هي اللي بتحكم فوترة العميل، مش على المصروف). المرتجع بالسالب. */
  const o=OV.o,lines=OV.lines;const usersSnap=await db.collection('Users').get().catch(()=>({docs:[]}));const users=usersSnap.docs.map(d=>({id:d.id,...d.data()}));
  const findSup=vn=>users.find(u=>norm(u.name||'')===norm(vn||''));

async function spendDecideFb(id,decision){

async function teamRepDecide(id,decision){
  const r=TRP.rows.find(x=>String(x.id)===String(id));if(!r||String(r.status)!=='pending_mgr'){pfToast('مش في محطتك',false);return;}
  let note='';if(decision!=='approve'){note=(prompt('سبب الإرجاع (إجباري):')||'').trim();if(note.length<3){pfToast('لازم سبب',false);return;}}
  const next=decision!=='approve'?'returned':'pending_chair';
  try{await db.collection('DailyReports').doc(String(id)).set({status:next,mgrBy:S.user.name||'',mgrDate:today10Fb(),mgrNote:note},{merge:true});pfToast(decision==='approve'?'اتحوّل للرئيس ✅':'اترجّع ↩️',true);}
  catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}

/* ---- حضور فريقي (المدير — سيلفيهات الفريق في الشهر) ---- */
let TAL={rows:[],names:{},m:''};
function openAttLog(m){
  if(!meManager()){denyScreen('حضور فريقي');return;}
  detachOps();m=m||curMonthFb();TAL={rows:[],names:{},m:m};
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:30px">جاري التحميل…</div>',crumbHome('حضور فريقي'));
  db.collection('Employees').get().then(s=>{const emps=s.docs.map(d=>({id:d.id,...d.data()}));const ids=teamEmpIds(emps);emps.forEach(e=>TAL.names[String(e.id)]=e.name||'');
    const mStart=m+'-01';const nd=new Date(m+'-01T00:00:00');nd.setMonth(nd.getMonth()+1);const mEnd=nd.getFullYear()+'-'+(nd.getMonth()+1<10?'0':'')+(nd.getMonth()+1)+'-01';
    db.collection('Attendance').where('timestamp','>=',mStart).where('timestamp','<',mEnd).get().catch(()=>({docs:[]})).then(sn=>{
      TAL.rows=sn.docs.map(d=>({id:d.id,...d.data()})).filter(a=>ids.indexOf(String(a.empId))!==-1&&String(a.void)!=='TRUE').sort((a,b)=>String(b.timestamp||'').localeCompare(String(a.timestamp||'')));
      talPaint();
    });
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbHome('حضور فريقي')));
}

  shell('<div class="card"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">📸 حضور فريقي</h3><input type="month" value="'+esc(TAL.m)+'" onchange="openAttLog(this.value)" style="max-width:170px;padding:7px;border:1.5px solid var(--line);border-radius:8px"></div></div>'+
    '<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>الموظف</th><th>النوع</th><th>الوقت</th><th>المكان</th><th>سيلفي</th></tr></thead><tbody>'+

/* ---- بنوك (خاص بالمحاسب) — طبقة توزيع العهدة على بنوك ---- */

function bkPaint(){
  const sum=BNK.list.reduce((a,b)=>a+(+b.balance||0),0);
  shell('<div class="card"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">🏦 بنوكي</h3><button class="btn" onclick="bkAddForm()">➕ بنك جديد</button></div><div class="muted" style="font-size:12px;margin-top:4px">طبقة خاصة بيك لوحدك — مبتلمسش حسابات البرنامج ومبتظهرش لحد تاني. وزّع عهدتك على بنوكك وتابع رصيد كل بنك.</div></div>'+
    '<div class="stats"><div class="stat"><div class="l">مجموع البنوك</div><div class="v">'+fmt(sum)+' <small>ج</small></div></div><div class="stat"><div class="l">عدد البنوك</div><div class="v">'+BNK.list.length+'</div></div></div>'+
    '<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>البنك</th><th>الرصيد</th><th></th></tr></thead><tbody>'+
    (BNK.list.map(b=>'<tr><td><b>'+esc(b.name||'')+'</b>'+(String(b.isMain)==='TRUE'?' <span class="muted" style="font-size:11px">(الرئيسي)</span>':'')+'</td><td class="num"'+((+b.balance||0)<0?' style="color:#B26A00"':'')+'><b>'+fmt(b.balance)+'</b></td><td style="white-space:nowrap">'+(BNK.list.length>1?'<button class="btn sm ghost" onclick="bkFundForm(\''+esc(b.id)+'\')">💱 تحويل</button> ':'')+(String(b.isMain)==='TRUE'?'':'<button class="btn sm ghost" style="color:#B3261E" onclick="bkDelForm(\''+esc(b.id)+'\')">🗑️</button>')+'</td></tr>').join('')||'<tr><td colspan="3" class="muted" style="text-align:center;padding:14px">مفيش بنوك — ابدأ بإضافة بنك</td></tr>')+'</tbody></table></div><div id="bkHost"></div>',

}
function bkHostSet(h){const e=el('bkHost');if(e){e.innerHTML=h;e.scrollIntoView({behavior:'smooth',block:'start'});}}
function bkAddForm(){bkHostSet('<div class="card" style="border:2px solid var(--red)"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">➕ بنك جديد</h3><button class="btn sm ghost" onclick="bkHostSet(\'\')">✕</button></div><div class="rowline" style="margin-top:8px"><div style="flex:2"><label>اسم البنك *</label><input id="bk_nm" placeholder="بنك مصر · القاهرة…"></div><div style="flex:1"><label>الرصيد الحالي</label><input id="bk_op" type="number" step="any" placeholder="0"></div></div><div class="err" id="bk_err"></div><div class="rowline" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" onclick="bkHostSet(\'\')">إلغاء</button> <button class="btn" onclick="bkAdd()">💾 إضافة</button></div></div>');}
async function bkAdd(){const nm=((el('bk_nm')||{}).value||'').trim(),op=parseFloat((el('bk_op')||{}).value)||0,err=el('bk_err');if(err)err.textContent='';if(!nm){if(err)err.textContent='اكتب اسم البنك.';return;}
  try{const id=genId('bank');const isMain=BNK.list.length===0;await db.collection('Banks').doc(id).set({id:id,userId:String(S.user.id),name:nm,balance:Math.round(op*100)/100,isMain:isMain?'TRUE':'FALSE'});pfToast('اتضاف ✅',true);openBanks();}catch(e){if(err)err.textContent='تعذّر: '+(e.code||e.message);}}
function bkFundForm(id){bkHostSet('<div class="card" style="border:2px solid var(--red)"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">💱 تحويل بين البنوك</h3><button class="btn sm ghost" onclick="bkHostSet(\'\')">✕</button></div><div class="rowline" style="margin-top:8px"><div style="flex:2"><label>من بنك *</label><select id="bk_from">'+BNK.list.map(b=>'<option value="'+esc(b.id)+'"'+(String(b.isMain)==='TRUE'?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div><div style="flex:2"><label>إلى بنك *</label><select id="bk_to">'+BNK.list.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===id?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div><div style="flex:1"><label>المبلغ *</label><input id="bk_amt" type="number" step="any"></div></div><div class="err" id="bk_err"></div><div class="rowline" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" onclick="bkHostSet(\'\')">إلغاء</button> <button class="btn" onclick="bkFund()">💾 تحويل</button></div></div>');}
async function bkFund(){const f=(el('bk_from')||{}).value,t=(el('bk_to')||{}).value,a=parseFloat((el('bk_amt')||{}).value)||0,err=el('bk_err');if(err)err.textContent='';if(f===t){if(err)err.textContent='اختار بنكين مختلفين.';return;}if(!(a>0)){if(err)err.textContent='اكتب مبلغ.';return;}
  const bf=BNK.list.find(b=>b.id===f),bt=BNK.list.find(b=>b.id===t);if(!bf||!bt)return;
  try{const batch=db.batch();batch.set(db.collection('Banks').doc(f),{balance:Math.round(((+bf.balance||0)-a)*100)/100},{merge:true});batch.set(db.collection('Banks').doc(t),{balance:Math.round(((+bt.balance||0)+a)*100)/100},{merge:true});await batch.commit();pfToast('اتحوّل ✅',true);openBanks();}catch(e){if(err)err.textContent='تعذّر: '+(e.code||e.message);}}
function bkDelForm(id){const others=BNK.list.filter(b=>b.id!==id);if(!others.length){pfToast('لازم بنك تاني الرصيد يروح له',false);return;}const b=BNK.list.find(x=>x.id===id)||{};
  bkHostSet('<div class="card" style="border:2px solid var(--warn)"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">🗑️ حذف «'+esc(b.name||'')+'»</h3><button class="btn sm ghost" onclick="bkHostSet(\'\')">✕</button></div><div class="muted" style="font-size:12.5px;margin-top:4px">رصيده ('+fmt(b.balance||0)+') هينتقل للبنك اللي تختاره.</div><label style="margin-top:8px">ينقل رصيده لـ *</label><select id="bk_del_to">'+others.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+(String(x.isMain)==='TRUE'?' (الرئيسي)':'')+'</option>').join('')+'</select><div class="rowline" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" onclick="bkHostSet(\'\')">إلغاء</button> <button class="btn" style="background:#B3261E" onclick="bkDel(\''+esc(id)+'\')">🗑️ احذف وانقل</button></div></div>');}
async function bkDel(id){const to=(el('bk_del_to')||{}).value;const b=BNK.list.find(x=>x.id===id),bt=BNK.list.find(x=>x.id===to);if(!b||!bt)return;
  try{const batch=db.batch();batch.set(db.collection('Banks').doc(to),{balance:Math.round(((+bt.balance||0)+(+b.balance||0))*100)/100},{merge:true});batch.delete(db.collection('Banks').doc(id));await batch.commit();pfToast('اتحذف ✅',true);openBanks();}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}}

    sec('⏱️ الأوفرتايم','البرنامج بيحسب الأوفرتايم تلقائياً: الشغل بعد ميعاد الانصراف، والجلسات الليلية، والشغل في الإجازات الرسمية (بحد أقصى 8 ساعات لليوم). ساعة الأوفرتايم = الأساسي ÷ 240 × 2. وفيه أوفرتايم يدوي بطلب يعتمده المدير/الرئيس.')+

    sec('💳 السلف','الموظف يطلب سلفة من «سلفتي» ← مراجعة الحسابات ← اعتماد الرئيس ← بتتحوّل سلفة بتُخصم أقساطها الشهرية من المرتب تلقائياً.')+

function punchGps(){

  navigator.geolocation.watchPosition(p=>{PUNCH.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};const near=punchNearest();const g=el('pgps');if(g)g.innerHTML=near.inside?('<span style="color:#1F7A3D">📍 داخل نطاق «'+esc(near.name)+'» (دقة ±'+Math.round(PUNCH.gps.acc)+'م)</span>'):('<span style="color:#B26A00">📍 '+(near.name?'أقرب مكان «'+esc(near.name)+'» على بعد '+Math.round(near.dist)+'م':'مفيش مكان قريب')+' (دقة ±'+Math.round(PUNCH.gps.acc)+'م)</span>');},e=>{const g=el('pgps');if(g)g.innerHTML='<span style="color:var(--red)">تعذّر تحديد الموقع — فعّل GPS</span>';},{enableHighAccuracy:true,timeout:15000,maximumAge:5000});

function punchNearest(){
  const gps=PUNCH.gps;if(!gps)return {inside:false,name:'',dist:1e12};
  const allow=l=>!PUNCH.allowed.length||PUNCH.allowed.indexOf(l.id)!==-1;
  let inName='',inBest=1e12,bestN='',bestD=1e12;
  PUNCH.locs.forEach(l=>{const d=distM(gps.lat,gps.lng,l.lat,l.lng);if(allow(l)){if(d<=l.r&&d<inBest){inBest=d;inName=l.name;}if(d<bestD){bestD=d;bestN=l.name;}}});

  return {inside:false,name:bestN,dist:bestD};
}

const POLICIES_FB={site:{name:'مهندسي المواقع',tIn:'08:00',tOut:'16:00',grace:30,tiers:[[15,0.05],[30,0.10],[45,0.40],[60,0.65],[99999,-3]]},office:{name:'إداري/مكتب فني',tIn:'09:00',tOut:'15:00',grace:10,tiers:[[20,0.30],[50,0.50],[99999,-1]]}};

function hm2min(t){const x=String(t||'').split(':');return (+x[0]||0)*60+(+x[1]||0);}
function polOfE(e){const p=POLICIES_FB[String(e.policy||'')]||POLICIES_FB.site;return {key:String(e.policy||'site'),grace:p.grace,tiers:p.tiers,tIn:String(e.tIn||'')||p.tIn,tOut:String(e.tOut||'')||p.tOut,twoShift:String(e.twoShift)==='TRUE',tIn2:String(e.tIn2||''),tOut2:String(e.tOut2||'')};}
function tierOfP(p,mins){if(mins<=0)return {d:0,whole:false};for(let i=0;i<p.tiers.length;i++){if(mins<=p.tiers[i][0]){const v=p.tiers[i][1];return v<0?{d:-v,whole:true}:{d:v,whole:v>=1};}}return {d:0,whole:false};}
function shiftOfP(p,inMin){const pairs=[[hm2min(p.tIn),hm2min(p.tOut)]];if(p.twoShift&&p.tIn2)pairs.push([hm2min(p.tIn2),hm2min(p.tOut2||p.tOut)]);let best=null,bestD=null;pairs.forEach(pr=>{const d=inMin-pr[0];if(d<-HRC.earlyInCap)return;if(bestD===null||Math.abs(d)<Math.abs(bestD)){bestD=d;best=pr;}});if(!best){const f=pairs[0].slice();f.off=true;return f;}return best;}
function dayCalcFb(e,firstIn,lastOut,iznIn,iznOut){const p=polOfE(e);const out={ded:0,lateMin:0,earlyOutMin:0,missOut:false,otIn:0,otOut:0};if(!firstIn)return out;const inMin=hm2min(String(firstIn).slice(11,16));const sh=shiftOfP(p,inMin),st=sh[0],en=sh[1];const off=!!sh.off;out.lateMin=Math.max(0,inMin-st);let earlyIn=off?0:Math.max(0,st-inMin);let lateOut=0,earlyOut=0;if(lastOut){const outMin=hm2min(String(lastOut).slice(11,16));lateOut=Math.max(0,outMin-en);earlyOut=Math.max(0,en-outMin);}else out.missOut=true;const offset=Math.min(earlyIn,earlyOut);earlyIn-=offset;earlyOut-=offset;if(off)return out;const lateNet=Math.max(0,out.lateMin-p.grace-(+iznIn||0));const tL=tierOfP(p,lateNet);let earlyDed=0,tE={d:0,whole:false};if(!out.missOut){const earlyNet=Math.max(0,earlyOut-HRC.outGrace-(+iznOut||0));tE=tierOfP(p,earlyNet);earlyDed=tE.d;}if(tL.whole||tE.whole)out.ded=Math.max(tL.whole?tL.d:0,tE.whole?tE.d:0);else out.ded=Math.min(HRC.dayCap,tL.d+earlyDed);out.earlyOutMin=earlyOut;if(earlyIn>=HRC.otMinMin)out.otIn=earlyIn;if(lateOut>=HRC.otMinMin)out.otOut=lateOut;return out;}
function isFriFb(d){return new Date(d+'T00:00:00').getDay()===5;}
/* حساب مرتب موظف لشهر (core: تأخير/غياب/أوفرتايم/إجازة/سلفة/زيارات) */
function salComputeFb(e,month,ctx){
  const basic=+e.basic||0,dayVal=basic/30;
  const out={late:0,abs:0,ot:0,lvDed:0,inst:0,vtrans:0,missOutN:0};
  const exempt=String(e.exemptAtt)==='TRUE';
  const hols=ctx.hols||{};let holOTh=0;
  const isHolD=d=>isFriFb(d)||hols[d]!==undefined;
  if(!exempt){
    const byDay={},outDay={};
    (ctx.att||[]).forEach(a=>{if(String(a.empId)!==String(e.id)||String(a.void)==='TRUE'||String(a.otSess)==='TRUE')return;const ts=String(a.timestamp);if(ts.slice(0,7)!==month)return;const d=ts.slice(0,10);if(a.type==='in'){if(!byDay[d]||ts<byDay[d])byDay[d]=ts;}else if(a.type==='out'){if(!outDay[d]||ts>outDay[d])outDay[d]=ts;}});
    // أذونات ونص يوم
    const izn={},halfMap={};
    (ctx.leaves||[]).forEach(l=>{if(String(l.empId)!==String(e.id)||String(l.status)!=='approved')return;const d=String(l.dFrom).slice(0,10);if(d.slice(0,7)!==month)return;if(l.kind==='perm'){izn[d]=izn[d]||{inM:0,outM:0};izn[d].inM+=(+l.inM||0);izn[d].outM+=(+l.outM||0);}if(l.kind==='half')halfMap[d]=(String(l.sideKind)==='am')?'am':'pm';});
    const pHalf=polOfE(e),halfW=Math.max(0,(hm2min(pHalf.tOut)-hm2min(pHalf.tIn))/2);
    let lateD=0,missN=0,missD=0;
    Object.keys(byDay).sort().forEach(d=>{if(isHolD(d))return;const iz=izn[d]||{inM:0,outM:0};let hIn=iz.inM,hOut=iz.outM;if(halfMap[d]==='am')hIn+=halfW;else if(halfMap[d]==='pm')hOut+=halfW;const c=dayCalcFb(e,byDay[d],outDay[d]||null,hIn,hOut);lateD+=c.ded;if(c.missOut){missN++;if(missN>HRC.missOutFree)missD+=HRC.missOutDed;}});
    out.late=Math.round((lateD+missD)*dayVal*100)/100;out.missOutN=missN;
    // أوفرتايم الجمعة/الإجازة العامة: ساعات الشغل (بحد 8 ساعات لليوم، لازم انصراف مسجّل)
    Object.keys(byDay).forEach(d=>{if(!isHolD(d))return;if(!outDay[d])return;const inM=hm2min(String(byDay[d]).slice(11,16)),outM=hm2min(String(outDay[d]).slice(11,16));let hrs=Math.max(0,(outM-inM)/60);hrs=Math.round(hrs*10)/10;if(hrs>8)hrs=8;holOTh+=hrs;});
    let absDays=0;(ctx.abs||[]).forEach(a=>{if(String(a.empId)===String(e.id)&&String(a.date).slice(0,7)===month)absDays+=(a.dec==='d3'?3:1);});
    out.abs=Math.round(absDays*dayVal*100)/100;
  }
  let otMin=0;(ctx.leaves||[]).forEach(l=>{if(String(l.empId)!==String(e.id)||l.status!=='approved')return;if(String(l.dFrom).slice(0,7)!==month)return;if(l.kind==='ot')otMin+=(+l.minutes||0);});
  // أوفرتايم الجلسات الليلية (otSess): مدة كل جلسة in→out — بيحسبه البرنامج تلقائياً
  const nSess={};(ctx.att||[]).forEach(a=>{if(String(a.empId)!==String(e.id)||String(a.void)==='TRUE'||String(a.otSess)!=='TRUE')return;const ts=String(a.timestamp);if(ts.slice(0,7)!==month)return;const d=ts.slice(0,10);nSess[d]=nSess[d]||{};if(a.type==='in'){if(!nSess[d].in||ts<nSess[d].in)nSess[d].in=ts;}else{if(!nSess[d].out||ts>nSess[d].out)nSess[d].out=ts;}});
  let nightMin=0;Object.keys(nSess).forEach(d=>{const s=nSess[d];if(s.in&&s.out){let dm=hm2min(s.out.slice(11,16))-hm2min(s.in.slice(11,16));if(dm<0)dm+=1440;if(dm>=HRC.otMinMin)nightMin+=dm;}});
  otMin+=nightMin;
  out.ot=Math.round(((otMin/60)+holOTh)*2*basic/240*100)/100;out.holOTh=holOTh;out.otMin=otMin;
  // خصم الإجازة الزايدة عن الرصيد
  const unl=String(e.unlimLeave)==='TRUE';
  if(!unl){let poolReg=+e.balReg||0,poolCas=+e.balCas||0,dedM=0;(ctx.leaves||[]).forEach(l=>{if(String(l.empId)!==String(e.id)||String(l.status)!=='approved')return;const days=+l.days||0;if(days<=0)return;if(String(l.dFrom).slice(0,7)!==month)return;let ded=0;if(l.kind==='unpaid')ded=days;else if(l.kind==='reg'||l.kind==='half'){const u=Math.min(poolReg,days);poolReg-=u;ded=days-u;}else if(l.kind==='cas'){const u=Math.min(poolCas,days);poolCas-=u;ded=days-u;}dedM+=ded;});out.lvDed=Math.round(dedM*dayVal*100)/100;}
  // بدل مواصلات بالزيارة
  let vt=0;(ctx.visits||[]).forEach(v=>{if(String(v.empId)!==String(e.id))return;if(String(v.date||v.timestamp||'').slice(0,7)!==month)return;const fee=ctx.visitFee[String(v.projectId||'')]||0;vt+=fee;});out.vtrans=Math.round(vt*100)/100;
  // قسط السلفة
  let inst=0;(ctx.adv||[]).forEach(a=>{if(String(a.empId)!==String(e.id)||String(a.active)==='FALSE'||!(+a.remaining>0))return;if(a.adate&&String(a.adate).slice(0,7)>month)return;inst+=Math.min(+a.installment||0,+a.remaining||0);});out.inst=Math.round(inst*100)/100;
  return out;
}

function r2(x){return Math.round((+x||0)*100)/100;}
function salCalc(e){
  const c=salComputeFb(e,SAL.month,SAL.ctx);const man=SAL.manual[String(e.id)]||{};const basic=+e.basic||0;
  let earnM=0;SAL_EARN_M.forEach(f=>earnM+=+man[f[0]]||0);
  let dedM=0;SAL_DED_M.forEach(f=>dedM+=+man[f[0]]||0);

function curMonthFb(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1);}
/* تحميل سياق المرتبات لشهر — يُستخدم في «المرتبات» و«مرتبي» معاً (نفس الحسابات) */
function salLoad(m){
  const mStart=m+'-01';const nd=new Date(m+'-01T00:00:00');nd.setMonth(nd.getMonth()+1);const mEnd=nd.getFullYear()+'-'+(nd.getMonth()+1<10?'0':'')+(nd.getMonth()+1)+'-01';
  return Promise.all([
    db.collection('Employees').get().catch(()=>({docs:[]})),
    db.collection('Users').get(),
    db.collection('Attendance').where('timestamp','>=',mStart).where('timestamp','<',mEnd).get().catch(()=>({docs:[]})),
    db.collection('Leaves').get().catch(()=>({docs:[]})),
    db.collection('AbsDecisions').get().catch(()=>({docs:[]})),
    db.collection('Advances').get().catch(()=>({docs:[]})),
    db.collection('Visits').get().catch(()=>({docs:[]})),
    db.collection('Projects').get().catch(()=>({docs:[]})),
    db.collection('Salaries').get().catch(()=>({docs:[]})),
    db.collection('SalMonths').doc(m).get().catch(()=>({exists:false})),
    db.collection('PublicHolidays').get().catch(()=>({docs:[]}))
  ]).then(r=>{
    let emps=r[0].docs.map(d=>({id:d.id,...d.data()}));
    const users=r[1].docs.map(d=>({id:d.id,...d.data()}));
    if(!emps.length){emps=users.filter(u=>String(u.role||'')&&['client','contractor','vendor'].indexOf(String(u.role))===-1&&String(u.role)!=='chairman').map(u=>({id:u.id,userId:u.id,name:u.name,...u}));}
    const uById={};users.forEach(u=>uById[u.id]=u);
    emps.forEach(e=>{const u=uById[String(e.userId||e.id)];if(u){['policy','tIn','tOut','twoShift','tIn2','tOut2','exemptAtt','unlimLeave','basic','balReg','balCas','bank','job','confirmed'].forEach(f=>{if((e[f]===undefined||e[f]===''||e[f]===null)&&u[f]!==undefined)e[f]=u[f];});if(!e.name)e.name=u.name;}});
    emps=emps.filter(e=>e.name);
    const visitFee={};r[7].docs.forEach(d=>visitFee[d.id]=+d.data().visitFee||0);
    const hols={};(r[10]?r[10].docs:[]).forEach(d=>{const x=d.data();const hd=String(x.hdate||'').slice(0,10);if(hd)hols[hd]=String(x.name||'إجازة عامة');});
    SAL.month=m;
    SAL.ctx={att:r[2].docs.map(d=>d.data()),leaves:r[3].docs.map(d=>d.data()),abs:r[4].docs.map(d=>d.data()),adv:r[5].docs.map(d=>d.data()),visits:r[6].docs.map(d=>d.data()),visitFee:visitFee,hols:hols};
    SAL.manual={};r[8].docs.forEach(d=>{const x=d.data();if(String(x.month)===m)SAL.manual[String(x.empId)]=x;});
    SAL.emps=emps.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
    SAL.closed=r[9].exists;
    return SAL;
  });
}

function finCompute(){
  const f=FIN.from,t=FIN.to,withSup=FIN.withSup;
  const inR=d=>{d=String(d||'').slice(0,10);if(!d)return !f&&!t;if(f&&d<f)return false;if(t&&d>t)return false;return true;};
  const okD=(r,own)=>String(r.decDate||'').slice(0,10)||String(r[own]||'').slice(0,10);
  const spDone=r=>(String(r.st||'APPROVED'))==='APPROVED';
  const payOK=r=>String(r.void)!=='TRUE'&&((String(r.pst||'')||'APPROVED')==='APPROVED');
  const pn={},supP={};FIN.projs.forEach(p=>{pn[p.id]=p.name||'';if(String(p.supOnly)==='TRUE')supP[p.id]=1;});
  const skip=pid=>!withSup&&!!supP[String(pid||'')];
  const projCli={},cliProjs={};FIN.users.forEach(x=>{if(String(x.isClient)!=='TRUE'&&String(x.role)!=='client')return;let pj=[];try{pj=(JSON.parse(x.projIds||'[]')||[]).map(String);}catch(e){}cliProjs[x.id]=pj;pj.forEach(pid=>{if(!projCli[pid])projCli[pid]=x.id;});});
  const EX_FIN={CHAIRMAN_APPROVE:1,RECORD:1,CHAIRMAN_DIRECT:1};
  const fin={};FIN.appr.forEach(g=>{if(!EX_FIN[String(g.action||'')])return;const id=String(g.extractId||''),ts=String(g.timestamp||'').slice(0,10);if(id&&ts&&(!fin[id]||ts>fin[id]))fin[id]=ts;});
  const P={};const proj=pid=>{pid=String(pid||'');if(!P[pid])P[pid]={id:pid,name:pid?(pn[pid]||'؟'):'بدون عملية',cont:0,sup:0,cus:0,spend:0,coll:0};return P[pid];};
  const exp={contractors:0,suppliers:0,custody:0};
  const addExp=(cat,pid,v)=>{if(skip(pid))return;const pr=proj(pid);if(cat==='cont'){exp.contractors+=v;pr.cont+=v;}else if(cat==='sup'){exp.suppliers+=v;pr.sup+=v;}else{exp.custody+=v;pr.cus+=v;}pr.spend+=v;};
  FIN.ext.forEach(e=>{if(String(e.status)!=='FINAL')return;const d=fin[String(e.id)]||String(e.updatedAt||'').slice(0,10);if(!inR(d))return;const v=+e.netDue||0;if(!v)return;addExp('cont',e.projectId,v);});
  FIN.spend.forEach(r=>{const k=String(r.kind);if(k==='adv')return;if(String(r.void)==='TRUE'||!spDone(r))return;const d=okD(r,'sdate');if(!inR(d))return;const v=+r.amount||0;if(!v)return;if(k==='set')addExp('cus',r.projectId,v);else addExp('sup',r.projectId,v);/* sup + exp (مصروف مباشر) = فئة الموردين/المصروفات */});
  let payTotal=0;
  FIN.cpay.forEach(r=>{if(!payOK(r))return;const d=okD(r,'date');if(!inR(d))return;const v=+r.amount||0;if(!v)return;if(skip(r.projectId))return;payTotal+=v;});
  FIN.spend.forEach(r=>{if(String(r.kind)!=='adv'||!String(r.fromHolderId||''))return;if(String(r.void)==='TRUE'||!spDone(r))return;const d=okD(r,'sdate');if(!inR(d))return;const v=+r.amount||0;if(!v)return;if(skip(r.projectId))return;payTotal+=v;});
  let collTotal=0;
  FIN.clipay.forEach(r=>{if(!payOK(r))return;const d=okD(r,'pdate');if(!inR(d))return;const v=+r.amount||0;if(!v)return;const cid=String(r.clientId||''),pid=String(r.projectId||'');if(skip(pid))return;if(!pid&&!withSup&&(cliProjs[cid]||[]).length&&(cliProjs[cid]||[]).every(q=>supP[q]))return;collTotal+=v;if(pid)proj(pid).coll+=v;});
  FIN.data={exp:exp,payTotal:payTotal,collTotal:collTotal,P:P,cost:exp.contractors+exp.suppliers+exp.custody};
}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function ensureXLSX(){return new Promise(function(res,rej){if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=function(){res();};s.onerror=function(){rej(new Error('تعذّر تحميل مكتبة Excel'));};document.head.appendChild(s);});}
async function backupDo(fmt){
  el('bkXlsx').disabled=true;el('bkJson').disabled=true;el('bkLog').innerHTML='';
  try{
    if(fmt==='xlsx')await ensureXLSX();
    const all={};let total=0;
    for(const pair of BK_COLLS){const en=pair[0],ar=pair[1];
      bkLog('بيقرا '+ar+'…');
      const s=await db.collection(en).get();
      all[en]=s.docs.map(d=>Object.assign({id:d.id},d.data()));
      total+=all[en].length;
    }
    bkLog('إجمالي '+total.toLocaleString('en')+' سجل. بيجهّز الملف…');
    const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    if(fmt==='json'){
      dl(new Blob([JSON.stringify(all)],{type:'application/json'}),'TrustGroup_backup_'+stamp+'.json');
    }else{
      const wb=XLSX.utils.book_new();const used={};
      for(const pair of BK_COLLS){const en=pair[0];let ar=pair[1].slice(0,31);if(used[ar])ar=(en).slice(0,31);used[ar]=1;
        const rows=(all[en]||[]).map(r=>{const o=Object.assign({},r);if(en==='Attendance'&&o.selfie)o.selfie='[صورة]';return o;});
        const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}]);
        XLSX.utils.book_append_sheet(wb,ws,ar);
      }
      XLSX.writeFile(wb,'TrustGroup_backup_'+stamp+'.xlsx');
    }
    bkLog('✅ تم تجهيز الملف وبدأ التنزيل.');
  }catch(e){bkLog('✗ خطأ: '+(e.code||e.message));}
  el('bkXlsx').disabled=false;el('bkJson').disabled=false;
}

function peopleCompute(){
  const byId={};PPL.raw.forEach(u=>byId[u.id]=u);
  PPL.all=PPL.raw.map(u=>{
    const cl=String(u.isClient)==='TRUE',co=String(u.isContractor)==='TRUE',ve=String(u.isVendor)==='TRUE';
    let pj=[];try{pj=JSON.parse(u.projIds||'[]');}catch(e){}
    let cp=false;try{const p=JSON.parse(u.perms||'{}');cp=p&&Object.keys(p).length>0;}catch(e){}
    const mgr=byId[u.managerId];
    return {id:u.id,name:u.name||'',roleName:ROLES_[u.role]||u.role||'',job:u.job||'',phone:u.phone||'',
      managerName:mgr?(mgr.name||''):'',projects:pj.map(id=>PPL.proj[id]||id).filter(Boolean),
      username:u.username||'',active:String(u.active).toUpperCase()==='TRUE',hidden:String(u.hidden)==='TRUE',
      isClient:cl,isContractor:co,isVendor:ve,isParty:(cl||co||ve),customPerms:cp};
  });
}
function pplRows(){const q=norm(PPL.q),k=PPL.kind;return PPL.all.filter(x=>{
  if(k==='staff'&&x.isParty)return false;
  if(k==='client'&&!x.isClient)return false;
  if(k==='supcon'&&!(x.isVendor||x.isContractor))return false;
  if(!q)return true;
  return norm(x.name).indexOf(q)!==-1||norm(x.roleName).indexOf(q)!==-1||norm(x.phone).indexOf(q)!==-1||norm(x.job).indexOf(q)!==-1;});}
function peoplePaint(){
  if(!el('pplBody'))return;
  const all=pplRows(),per=PPL.per,pages=Math.max(1,Math.ceil(all.length/per));

    (rows.map(x=>'<tr style="cursor:pointer'+(x.hidden?';opacity:.55':'')+'" title="اضغط للتعديل" onclick="go(function(){personForm(\''+esc(x.id)+'\')})">'+

      '<td style="font-size:12.5px"><div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span>'+esc(x.roleName||'—')+'</span>'+
        [x.isClient?'عميل':'',x.isContractor?'مقاول':'',x.isVendor?'مورّد':''].filter(Boolean).map(t=>pill(t,'#EEF2FF','#3730A3')).join('')+
        (x.customPerms?pill('صلاحيات خاصة','#FFE9CC','#8a5a00'):'')+
        (x.hidden?pill('🚫 متخفي','#FDE2E2','#B3261E'):'')+'</div></td>'+
      '<td style="font-size:12.5px">'+esc(x.job||'—')+'</td>'+
      '<td style="font-size:12.5px;direction:ltr;text-align:right">'+esc(x.phone||'—')+'</td>'+
      '<td style="font-size:12.5px">'+esc(x.managerName||'—')+'</td>'+
      '<td style="font-size:12px">'+esc(x.projects.join(' · ')||'—')+'</td>'+
      '<td style="font-size:12px">'+(x.username?esc(x.username):'<span class="muted">مفيش</span>')+'</td>'+
    '</tr>').join('')||'<tr><td colspan="7" class="muted" style="padding:16px;text-align:center">مفيش نتيجة</td></tr>')+
    '</tbody></table></div>';
  if(pages>1)h+='<div class="rowline" style="justify-content:center;align-items:center;gap:8px;margin-top:4px">'+
    '<button class="btn sm ghost" '+(PPL.page<=0?'disabled':'')+' onclick="PPL.page--;peoplePaint()">‹ السابق</button>'+
    '<span class="muted" style="font-size:12.5px">'+(PPL.page+1)+' / '+pages+'</span>'+
    '<button class="btn sm ghost" '+(PPL.page>=pages-1?'disabled':'')+' onclick="PPL.page++;peoplePaint()">التالي ›</button></div>';
  h+='<p class="muted" style="margin-top:8px">عرض لحظي · اضغط على أي صف للتعديل · أو «➕ إضافة فرد» لإضافة جديد.</p>';

function pfRole(){
  const isSup=pfC('pf_isSup'),isSupVen=pfC('pf_isSupVen');
  // المكتب نفسه: مقاول/مورد إشراف — نقفل باقي الصفات والدور
  if(isSup||isSupVen){
    ['pf_isClient','pf_isHolder'].forEach(id=>{const e=el(id);if(e){e.checked=false;e.disabled=true;}});
    const rc=el('pf_isContractor'),rv=el('pf_isVendor');if(rc){rc.checked=isSup;rc.disabled=true;}if(rv){rv.checked=isSupVen;rv.disabled=true;}
    const r=el('pf_role');if(r){r.value='';r.disabled=true;}
  }else{
    ['pf_isClient','pf_isHolder','pf_isContractor','pf_isVendor'].forEach(id=>{const e=el(id);if(e)e.disabled=false;});
    const r=el('pf_role');if(r)r.disabled=false;
  }
  const isVen=pfC('pf_isVendor')||isSupVen;
  const zb=el('pf_zerobox');if(zb)zb.style.display=isVen?'block':'none';
  const isCon=pfC('pf_isContractor')||isSup;
  const tb=el('pf_tradebox');if(tb)tb.style.display=(isCon||isVen)?'block':'none';
  const tl=el('pf_tradelab');if(tl)tl.textContent=isCon?'الأعمال (مقاولات)':'الأعمال (توريدات)';
  const hasRole=!!pfG('pf_role');
  const emp=el('pf_emp');if(emp)emp.style.display=hasRole?'block':'none';
  // الوظيفة label حسب الصفة
  const jl=el('pf_joblab');if(jl)jl.textContent=isCon?'الأعمال':(isVen?'التوريدات':'الوظيفة');
}

async function personSaveFb(id){
  if(!meChair()){pfToast('إدارة الأفراد للرئيس بس',false);return;}
  const errEl=el('pf_err');if(errEl)errEl.textContent='';
  const nm=pfG('pf_name').trim();
  if(!nm){if(errEl)errEl.textContent='اكتب الاسم.';return;}
  let isSup=pfC('pf_isSup'),isSupVen=pfC('pf_isSupVen');
  let isClient=pfC('pf_isClient'),isContractor=pfC('pf_isContractor'),isVendor=pfC('pf_isVendor'),isHolder=pfC('pf_isHolder');
  let role=pfG('pf_role');
  if(isSup||isSupVen){isContractor=isSup;isVendor=isSupVen;isClient=false;isHolder=false;role='';}
  if(!role&&!isClient&&!isContractor&&!isVendor&&!isSup&&!isSupVen){if(errEl)errEl.textContent='اختار دور وظيفي أو صفة واحدة على الأقل.';return;}
  const nn=norm(nm);
  for(const u of PF.users){if(String(u.id)!==String(id)&&norm(u.name)===nn){if(errEl)errEl.textContent='فيه شخص تاني بنفس الاسم.';return;}}
  const uname=pfG('pf_username').trim();
  if(uname){const un=uname.toLowerCase();for(const u of PF.users){if(String(u.id)!==String(id)&&String(u.username||'').trim().toLowerCase()===un){if(errEl)errEl.textContent='اسم المستخدم «'+uname+'» محجوز لشخص تاني.';return;}}}
  const hasStaffRole=role&&['client','contractor','vendor'].indexOf(role)===-1;
  const allowZero=(isVendor&&pfC('pf_allowZero'));
  const tbVisible=(isContractor||isVendor);
  const job=(tbVisible?pfG('pf_job2'):pfG('pf_job')).trim();
  const projIds=[].slice.call(document.querySelectorAll('.pf_pj:checked')).map(e=>e.value);
  const sb=el('pf_save');if(sb){if(sb.disabled)return;sb.disabled=true;sb.textContent='⏳ بيحفظ…';}
  try{
    const existing=id?(PF.users.find(u=>String(u.id)===String(id))||null):null;
    const oldName=existing?String(existing.name||''):'';
    const recId=id||genId('u');
    const rec=Object.assign({},existing||{});
    rec.id=recId;
    if(!existing){rec.active='TRUE';rec.empId=rec.empId||'';rec.perms=rec.perms||'{}';rec.partnerShares=rec.partnerShares||'{}';}
    rec.name=nm;rec.role=role;
    rec.isClient=isClient?'TRUE':'FALSE';rec.isContractor=isContractor?'TRUE':'FALSE';rec.isVendor=isVendor?'TRUE':'FALSE';
    rec.allowZero=allowZero?'TRUE':'FALSE';rec.isSupVen=isSupVen?'TRUE':'FALSE';
    rec.phone=pfG('pf_phone');rec.nid=pfG('pf_nid');rec.address=pfG('pf_address');rec.notes=pfG('pf_notes');
    rec.job=job;rec.projIds=JSON.stringify(projIds);
    rec.contractorId=String(rec.contractorId||'');rec.supplierId=String(rec.supplierId||'');
    if(el('pf_mgr'))rec.managerId=pfG('pf_mgr');else rec.managerId=String(rec.managerId||'');
    rec.isHolder=isHolder?'TRUE':'FALSE';
    rec.username=uname;const pw=pfG('pf_password');if(pw)rec.password=pw;rec.email=(pfG('pf_email')||'').trim().toLowerCase();
  // الصلاحيات الخاصة (الفرق عن افتراضي الدور) — للرئيس وللأدوار الداخلية فقط
  if(meChair()&&document.querySelectorAll('.pf_perm').length){const base={};(ROLE_PERMS[role]||[]).forEach(p=>base[p]=1);const over={};document.querySelectorAll('.pf_perm').forEach(cb=>{const p=cb.getAttribute('data-p'),on=cb.checked;if(on&&!base[p])over[p]=true;else if(!on&&base[p])over[p]=false;});rec.perms=JSON.stringify(over);}
    if(hasStaffRole){
      rec.basic=parseFloat(pfG('pf_basic'))||0;
      rec.confirmed=pfC('pf_confirmed')?'TRUE':'FALSE';rec.transport=pfC('pf_transport')?'TRUE':'FALSE';
      rec.exemptAtt=pfC('pf_exemptAtt')?'TRUE':'FALSE';rec.unlimLeave=pfC('pf_unlimLeave')?'TRUE':'FALSE';
      rec.repDuty=pfC('pf_repDuty')?'TRUE':'FALSE';
      rec.balReg=parseFloat(pfG('pf_balReg'))||0;rec.balCas=parseFloat(pfG('pf_balCas'))||0;
      rec.bank=pfG('pf_bank');rec.policy=pfG('pf_policy')||'site';
      rec.tIn=pfG('pf_tIn');rec.tOut=pfG('pf_tOut');
      rec.twoShift=pfC('pf_twoShift')?'TRUE':'FALSE';rec.tIn2=pfG('pf_tIn2');rec.tOut2=pfG('pf_tOut2');
    }
    const batch=db.batch();
    // Contractors — صف للمقاول (يحمل علامة مقاول إشراف والأعمال)
    if(isContractor){
      let ctId=String(rec.contractorId||'');
      let ctDoc=ctId?PF.contractors.find(c=>String(c.id)===ctId):null;
      if(!ctId){const ex=PF.contractors.find(c=>String(c.archived)!=='TRUE'&&norm(c.name)===nn);
        if(ex){ctId=String(ex.id);ctDoc=ex;}else{ctId=genId('ct');ctDoc=null;}rec.contractorId=ctId;}
      const cref=db.collection('Contractors').doc(ctId);
      if(ctDoc){const upd={};if(String(ctDoc.name)!==nm)upd.name=nm;if(String(ctDoc.trade||'')!==job)upd.trade=job;
        const ws=isSup?'TRUE':'FALSE';if(String(ctDoc.isSup||'FALSE')!==ws)upd.isSup=ws;
        if(Object.keys(upd).length)batch.set(cref,upd,{merge:true});}
      else{batch.set(cref,{id:ctId,name:nm,phone:rec.phone||'',trade:job||'',nid:rec.nid||'',address:rec.address||'',notes:'',files:'[]',typeIds:'[]',archived:'FALSE',isSup:isSup?'TRUE':'FALSE'});}
    }
    // Holders — صف لحامل العهدة
    if(isHolder){
      let hdId=String(rec.holderId||'');
      if(!hdId){const ex=PF.holders.find(h=>norm(h.name)===nn);
        if(ex)hdId=String(ex.id);else{hdId=genId('hd');batch.set(db.collection('Holders').doc(hdId),{id:hdId,name:nm,phone:rec.phone||'',archived:'FALSE',isArchiveOnly:'FALSE',notes:''});}}
      else{const ex=PF.holders.find(h=>String(h.id)===hdId);if(ex&&String(ex.name)!==nm)batch.set(db.collection('Holders').doc(hdId),{name:nm},{merge:true});}
      rec.holderId=hdId;
    }else{rec.holderId='';}
    // Suppliers — مزامنة الاسم عند التغيير فقط (زي القديم)
    if(existing&&oldName&&norm(oldName)!==nn&&String(rec.supplierId||'')){
      const sx=PF.suppliers.find(s=>String(s.id)===String(rec.supplierId));
      if(sx&&String(sx.name)!==nm)batch.set(db.collection('Suppliers').doc(String(rec.supplierId)),{name:nm},{merge:true});
    }
    batch.set(db.collection('Users').doc(recId),rec);
    await batch.commit();
    let renamed=0;
    if(existing&&oldName&&norm(oldName)!==nn)renamed=await propagateRename(recId,oldName,nm);
    // إنشاء حساب الدخول في Firebase لو فيه إيميل + باسورد (للموظف/العميل/المورد/المقاول)
    let authMsgTxt='';
    if(rec.email&&pw){
      if(pw.length<6){authMsgTxt=' · ⚠️ الباسورد أقصر من 6 حروف — حساب الدخول ماتعملش';}
      else{const r=await createAuthUser(rec.email,pw);
        if(r.ok)authMsgTxt=' · ✅ اتعمل حساب دخول ('+rec.email+')';
        else if(r.code==='auth/email-already-in-use')authMsgTxt=' · حساب الدخول موجود قبل كده';
        else authMsgTxt=' · ⚠️ حساب الدخول ماتعملش: '+authErrAr(r.code);}
    }
    pfToast('اتحفظ ✅'+(renamed?(' · تحدّث '+renamed+' حركة'):'')+authMsgTxt,true);
    navBack();
  }catch(e){
    if(errEl)errEl.textContent='تعذّر الحفظ: '+(e.code||e.message||e);
    const s2=el('pf_save');if(s2){s2.disabled=false;s2.textContent='💾 حفظ';}
  }
}
async function propagateRename(recId,oldName,nm){
  const refs=[],seen={};
  try{const s1=await db.collection('Spend').where('partyId','==',recId).get();s1.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;refs.push(d.ref);}});}catch(e){}
  try{const s2=await db.collection('Spend').where('vendorName','==',oldName).get();s2.forEach(d=>{if(!seen[d.id]){seen[d.id]=1;refs.push(d.ref);}});}catch(e){}
  let n=0;
  for(let i=0;i<refs.length;i+=400){const b=db.batch();refs.slice(i,i+400).forEach(ref=>b.set(ref,{vendorName:nm,partyId:recId},{merge:true}));await b.commit();n+=Math.min(400,refs.length-i);}
  return n;
}

async function personRefsFb(u){
  const detail={};let total=0;
  const nm=u.name||'',uid=String(u.id),cid=String(u.contractorId||''),sid=String(u.supplierId||''),hid=String(u.holderId||''),eid=String(u.empId||'');
  const cnt=async(coll,field,val,lbl)=>{if(!val)return;try{const s=await db.collection(coll).where(field,'==',val).get();if(s.size){detail[lbl]=(detail[lbl]||0)+s.size;total+=s.size;}}catch(e){}};
  await Promise.all([
    cnt('Extracts','contractorId',cid||uid,'مستخلصات'),
    cnt('Series','contractorId',cid||uid,'سلاسل'),
    cnt('Spend','partyId',uid,'مصروفات'),
    cnt('Spend','vendorName',nm,'مصروفات باسمه'),
    cnt('Spend','holderId',hid||uid,'حركات عهدة'),
    cnt('ContractorPayments','contractorId',cid||uid,'دفعات مقاول'),
    cnt('ClientPayments','clientId',uid,'دفعات عميل'),
    cnt('Attendance','empId',eid||uid,'حضور'),
    cnt('Leaves','empId',eid||uid,'إجازات'),
    cnt('Advances','empId',eid||uid,'سلف')
  ]);
  return {total:total,detail:detail};
}

  if(typed!==String(name).trim()){pfToast('الاسم مش مطابق — اتلغى الحذف',false);return;}

async function personMergeApply(){
  if(!meChair()){pfToast('الدمج للرئيس بس',false);return;}
  const base=MRG.base;if(!base)return;
  const ids=Object.keys(MRG.others).filter(k=>MRG.others[k]);
  if(!ids.length){pfToast('اختار فرد واحد على الأقل',false);return;}
  if(!confirm('دمج '+ids.length+' فرد في «'+base.name+'»؟ الإجراء بيوحّد الحركات ويوقف الأفراد المدموجين.'))return;
  pfToast('بيدمج…',true);
  try{
    const snaps=await db.collection('Users').get();const byId={};snaps.forEach(d=>byId[d.id]={id:d.id,...d.data()});
    const others=ids.map(i=>byId[i]).filter(Boolean);
    const newName=String(base.name||'');
    const cids={},sids={},oldNames={},oldIds={};
    [base].concat(others).forEach(r=>{if(r.contractorId)cids[String(r.contractorId)]=1;if(r.supplierId)sids[String(r.supplierId)]=1;if(norm(r.name)!==norm(newName))oldNames[norm(r.name)]=1;});
    others.forEach(r=>oldIds[String(r.id)]=1);
    const keepC=String(base.contractorId||''),keepS=String(base.supplierId||''),baseId=String(base.id);
    const batch=db.batch();let changed=0;
    // توحيد الاسم في Contractors/Suppliers
    for(const cid in cids){if(cid&&(!keepC||cid!==keepC)){batch.set(db.collection('Contractors').doc(cid),{name:newName},{merge:true});changed++;}else if(cid===keepC){batch.set(db.collection('Contractors').doc(cid),{name:newName},{merge:true});}}
    for(const sid in sids){batch.set(db.collection('Suppliers').doc(sid),{name:newName},{merge:true});changed++;}
    // إعادة ربط contractorId في Extracts/Series/ContractorPayments
    const repoint=async(coll,field,fromIds,toC)=>{for(const fid of fromIds){if(!fid)continue;try{const s=await db.collection(coll).where(field,'==',fid).get();s.forEach(d=>{batch.set(d.ref,{[field]:toC},{merge:true});changed++;});}catch(e){}}};
    const fromCs=Object.keys(cids).filter(c=>c&&c!==keepC);
    const fromSs=Object.keys(sids).filter(s=>s&&s!==keepS);
    if(keepC){await repoint('Extracts','contractorId',fromCs,keepC);await repoint('Series','contractorId',fromCs,keepC);await repoint('ContractorPayments','contractorId',fromCs,keepC);}
    // توحيد اسم المصروفات باسم قديم
    for(const r of others){const onm=r.name||'';if(norm(onm)!==norm(newName)&&onm){try{const s=await db.collection('Spend').where('vendorName','==',onm).get();s.forEach(d=>{batch.set(d.ref,{vendorName:newName},{merge:true});changed++;});}catch(e){}}}
    // ClientPayments clientId → base
    for(const oid in oldIds){try{const s=await db.collection('ClientPayments').where('clientId','==',oid).get();s.forEach(d=>{batch.set(d.ref,{clientId:baseId},{merge:true});changed++;});}catch(e){}}
    // دمج الصفات والعمليات والحقول الفاضية
    const flags={isClient:false,isContractor:false,isVendor:false};const projs={};const upd={};
    [base].concat(others).forEach(r=>{if(String(r.isClient)==='TRUE')flags.isClient=true;if(String(r.isContractor)==='TRUE')flags.isContractor=true;if(String(r.isVendor)==='TRUE')flags.isVendor=true;let pj=[];try{pj=JSON.parse(r.projIds||'[]');}catch(e){}pj.forEach(x=>projs[String(x)]=1);});
    upd.isClient=flags.isClient?'TRUE':'FALSE';upd.isContractor=flags.isContractor?'TRUE':'FALSE';upd.isVendor=flags.isVendor?'TRUE':'FALSE';upd.projIds=JSON.stringify(Object.keys(projs));
    others.forEach(r=>{['contractorId','supplierId','phone','nid','address','username','empId','job','holderId'].forEach(f=>{if(!String(base[f]||'')&&String(r[f]||''))upd[f]=r[f];});});
    batch.set(db.collection('Users').doc(baseId),upd,{merge:true});
    others.forEach(r=>{batch.set(db.collection('Users').doc(String(r.id)),{active:'FALSE',notes:String(r.notes||'')+' [اندمج في '+newName+']'},{merge:true});});
    // سجل الدمج
    const mid=genId('mg');batch.set(db.collection('MergeLog').doc(mid),{id:mid,ts:nowIsoFb(),byName:S.user.name||'',baseId:baseId,baseName:newName,others:others.map(r=>r.name||''),undone:'FALSE'});
    await batch.commit();
    document.querySelectorAll('[data-modal]').forEach(m=>m.remove());
    pfToast('اتدمج '+others.length+' فرد في «'+newName+'» ✅ ('+changed+' تغيير)',true);go(function(){personForm(baseId);});
  }catch(e){pfToast('تعذّر الدمج: '+(e.code||e.message),false);}
}

function loadRefs(){
  const need=[];
  if(!REF.types)need.push(db.collection('Types').get().then(s=>{REF.types={};s.forEach(d=>REF.types[d.id]=(d.data().name||d.id));}));
  if(!REF.contractors)need.push(db.collection('Contractors').get().then(s=>{REF.contractors={};s.forEach(d=>REF.contractors[d.id]=(d.data().name||d.id));}));
  if(!REF.usersById)need.push(db.collection('Users').get().then(s=>{REF.usersById={};s.forEach(d=>REF.usersById[d.id]=(d.data().name||d.id));}));
  if(!REF.projects)need.push(db.collection('Projects').get().then(s=>{REF.projects={};s.forEach(d=>REF.projects[d.id]=(d.data().name||d.id));}));
  return Promise.all(need);
}
function projName(id){if(!id)return '—';if(id==='__tech')return 'المكتب الفني';if(id==='__office')return 'المكتب';return (REF.projects&&REF.projects[id])||id;}
function modal(html){const o=document.createElement('div');o.setAttribute('data-modal','1');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px';const box=document.createElement('div');box.style.cssText='background:#fff;border-radius:14px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)';box.innerHTML=html+'<div style="text-align:left;margin-top:14px"><button class="btn ghost" onclick="this.closest(\'[data-modal]\').remove()">إغلاق</button></div>';o.appendChild(box);o.onclick=function(e){if(e.target===o)o.remove();};document.body.appendChild(o);}
const ST_={DRAFT:['مسودة عند المهندس','#EEE','#444'],SENT_TECH:['عند المكتب الفني','#FFF3D6','#8a6100'],RETURNED_TECH:['مُرجَع للمهندس','#FBE3E1','#8E2620'],APPROVED_TECH:['عند الحسابات','#EFE4FA','#6A35B3'],RETURNED_CHAIRMAN:['مُرجَع للحسابات','#FBE3E1','#8E2620'],APPROVED_CHAIRMAN:['عند الحسابات','#EFE4FA','#6A35B3'],RECORDED:['عند رئيس مجلس الإدارة','#E4ECFA','#2C5FB3'],FINAL:['معتمد نهائي ✓','#EAF3DE','#27500A']};
function extPill(st){const x=ST_[st]||[st||'—','#eee','#444'];return '<span class="pill" style="background:'+x[1]+';color:'+x[2]+'">'+esc(x[0])+'</span>';}

/* ===== تفاصيل العملية — لحظي ===== */
let PRJ={pid:null,proj:null,ext:[],pay:[]};
function openProject(pid){
  detachOps();PRJ={pid:pid,proj:null,ext:[],pay:[]};
  shell('<div id="prjBody"><div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري التحميل…</div></div>',
    '<div class="crumb"><a onclick="go(home)">🏠 الرئيسية</a> ← <a onclick="go(openOpsHome)">العمليات والعملاء</a> ← تفاصيل العملية</div>');
  Promise.all([db.collection('Projects').doc(pid).get(),loadRefs()]).then(r=>{const d=r[0];PRJ.proj=d.exists?Object.assign({id:d.id},d.data()):{id:pid,name:pid};if(prjActive())prjPaint();}).catch(prjErr);
  opsUnsub.push(db.collection('Extracts').onSnapshot(s=>{PRJ.ext=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>String(x.projectId)===pid);if(prjActive())prjPaint();flashLive();},prjErr));
  opsUnsub.push(db.collection('ClientPayments').onSnapshot(s=>{PRJ.pay=s.docs.map(x=>x.data()).filter(x=>String(x.projectId)===pid);if(prjActive())prjPaint();flashLive();},prjErr));
}
function prjActive(){return !!el('prjBody');}
function prjErr(e){if(el('prjBody'))el('prjBody').innerHTML='<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر التحميل: '+esc(e.code||e.message)+'</div>';}

      '<div class="stat"><div class="l">دفعات العملاء (معتمدة)</div><div class="v">'+fmt(payTot)+' <small>ج</small></div></div>'+
    '</div>'+
    '<h3 style="margin:14px 0 8px;font-size:15px">📐 المستخلصات</h3><div class="card" style="padding:0;overflow:auto"><table>'+

      '<td style="font-size:12px">'+esc(en(e.engineerId))+'</td>'+
      '<td>'+extPill(e.status)+'</td>'+

      '<td class="num">'+fmt(e.prevValue)+'</td>'+
      '<td class="num"><b>'+fmt(e.netDue)+'</b></td>'+
      '<td style="font-size:11.5px;direction:ltr;text-align:left">'+esc(String(e.createdAt||'').slice(0,10))+'</td>'+

    '<h3 style="margin:14px 0 8px;font-size:15px">💰 دفعات العملاء</h3><div class="card" style="padding:0;overflow:auto"><table>'+

      '<td style="direction:ltr;text-align:right">'+esc(x.pdate||'—')+'</td>'+

/* ===== العمليات والعملاء — لحظي ===== */
let opsUnsub=[],projects=[],extracts=[],pays=[];
function detachOps(){opsUnsub.forEach(u=>{try{u()}catch(e){}});opsUnsub=[];try{punchStop();}catch(e){}}
function flashLive(){const d=el('liveDot');if(!d)return;d.classList.remove('pulse');void d.offsetWidth;d.classList.add('pulse');}
function opsBtns(){
  const chair=meChair();
  return '<div class="rowline" style="gap:8px;margin:0 0 12px;flex-wrap:wrap">'+
    (chair?'<button class="btn" onclick="projForm()">➕ عملية جديدة</button>':'')+
    (chair?'<button class="btn ghost" onclick="go(openProjManage)">🗂️ إدارة العمليات</button>':'')+
    (chair?'<button class="btn ghost" onclick="go(openProjLocs)">📍 المواقع والنطاقات</button>':'')+
    (chair?'<button class="btn ghost" onclick="go(openSupRates)">📐 نسب الإشراف</button>':'')+

    '<button class="btn ghost" onclick="go(openProjAcctPick)">📊 حساب العملية</button>'+
    '</div>';
}
function openOpsHome(){
  if(permGuardAny(['projects_view','clients_view'],'العمليات والعملاء'))return;
  detachOps();projects=[];
  shell('<div class="card"><h3 style="margin:0">🏗️ العمليات والعملاء <span class="live"><span class="dot" id="liveDot"></span> لحظي</span></h3>'+
    '<div class="muted" style="font-size:12.5px;margin-top:3px">اضغط على العملية ← اختار السلسلة (المقاول ونوع الأعمال) ← مستخلص جاري جديد. ولو السلسلة مش موجودة اعملها من «➕ سلسلة جديدة».</div></div>'+
    opsBtns()+'<div id="opsGrid"><div class="card" style="text-align:center;color:var(--muted);padding:34px">جاري التحميل اللحظي…</div></div>',crumbHome('العمليات والعملاء'));
  opsUnsub.push(db.collection('Projects').onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));renderOps();flashLive();},opsErr));
}
function opsErr(e){const g=el('opsGrid');if(g)g.innerHTML='<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>';}
function renderOps(){
  if(!el('opsGrid'))return;
  const rows=projects.filter(p=>String(p.archived)!=='TRUE').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  if(!rows.length){el('opsGrid').innerHTML='<div class="card" style="text-align:center;color:var(--muted);padding:30px">لا توجد عمليات نشطة.</div>';return;}
  el('opsGrid').innerHTML='<div class="grid">'+rows.map(p=>{const pid=String(p.id).replace(/[^A-Za-z0-9_-]/g,'');const sup=String(p.supOnly)==='TRUE';return '<div class="tile" style="--tc:var(--red)" onclick="go(function(){openSeries(\''+pid+'\')})"><div class="th"><b class="hd" style="font-size:15px">'+esc(p.name||'—')+(sup?' <span style="color:#2C5FB3;font-size:11px">🔵 إشراف</span>':'')+'</b></div><div class="muted" style="margin-top:5px;font-size:12px">السلاسل والمستخلصات</div></div>';}).join('')+'</div>';
}
/* ===== ➕ عملية جديدة (الرئيس) ===== */
function projForm(){
  if(!meChair()){pfToast('إضافة العمليات للرئيس بس',false);return;}
  modal('<h3 style="margin:0 0 10px">🏗️ عملية جديدة</h3>'+
    '<div class="frm"><label>اسم العملية *</label><input id="pj_name" placeholder="اسم العملية…"></div>'+
    '<div class="err" id="pj_err" style="margin-top:6px"></div>'+
    '<div style="margin-top:12px"><button class="btn" id="pj_save" onclick="projAddFb()">💾 إنشاء</button></div>');
  setTimeout(()=>{const e=el('pj_name');if(e)e.focus();},50);
}
async function projAddFb(){
  const nm=((el('pj_name')||{}).value||'').trim(),err=el('pj_err');if(err)err.textContent='';
  if(!nm){if(err)err.textContent='اكتب اسم العملية.';return;}
  const nn=norm(nm);
  if(projects.some(p=>String(p.archived)!=='TRUE'&&norm(p.name)===nn)){if(err)err.textContent='فيه عملية بنفس الاسم.';return;}
  const b=el('pj_save');if(b){b.disabled=true;b.textContent='⏳…';}
  try{const id=genId('p');await db.collection('Projects').doc(id).set({id:id,name:nm,location:'',archived:'FALSE',lat:'',lng:'',radius:'',supOnly:'FALSE',supRate:0,visitFee:0});
    document.querySelectorAll('[data-modal]').forEach(m=>m.remove());pfToast('اتعملت العملية ✅',true);
  }catch(e){if(err)err.textContent='تعذّر: '+(e.code||e.message);if(b){b.disabled=false;b.textContent='💾 إنشاء';}}
}
/* ===== 🗂️ إدارة العمليات ===== */
let PM={projs:[],series:{}};
function openProjManage(){
  if(!meChair()){shell('<div class="card" style="text-align:center;padding:30px"><div style="font-size:34px">🔒</div><p class="muted">للرئيس بس.</p><button class="btn ghost" onclick="navBack()">رجوع</button></div>',crumbHome('إدارة العمليات'));return;}
  detachOps();
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:30px">جاري التحميل…</div>','<div class="crumb"><a onclick="go(home)">🏠 الرئيسية</a> ← <a onclick="go(openOpsHome)">العمليات</a> ← إدارة العمليات</div>');
  Promise.all([db.collection('Projects').get(),db.collection('Series').get().catch(()=>({docs:[]}))]).then(r=>{
    PM.projs=r[0].docs.map(d=>({id:d.id,...d.data()}));PM.series={};
    r[1].docs.forEach(d=>{const pid=String(d.data().projectId||'');if(pid)PM.series[pid]=(PM.series[pid]||0)+1;});
    renderProjManage();
  }).catch(e=>shell('<div class="card" style="color:var(--red);text-align:center;padding:24px">تعذّر: '+esc(e.code||e.message)+'</div>',crumbHome('إدارة العمليات')));
}
function renderProjManage(){
  const rows=PM.projs.slice().sort((a,b)=>String(a.archived).localeCompare(String(b.archived))||(a.name||'').localeCompare(b.name||'','ar'));
  const h='<div class="card"><div class="rowline" style="align-items:center"><h3 style="margin:0;flex:1">🗂️ إدارة العمليات</h3></div>'+
    '<div style="padding:0;overflow:auto;margin-top:8px"><table><thead><tr><th>العملية</th><th>السلاسل</th><th>الموقع</th><th>الحالة</th><th></th></tr></thead><tbody>'+
    rows.map(p=>{const pid=esc(p.id);const arch=String(p.archived)==='TRUE';const loc=(p.lat&&p.lng)?'محدد ✓':'—';return '<tr>'+
      '<td><b>'+esc(p.name||'—')+'</b></td>'+
      '<td class="num">'+(PM.series[String(p.id)]||0)+'</td>'+
      '<td style="font-size:12px">'+loc+'</td>'+
      '<td>'+(arch?'<span class="pill off">مؤرشفة</span>':'<span class="pill on">نشطة</span>')+'</td>'+
      '<td style="white-space:nowrap">'+
        '<button class="btn sm ghost" onclick="projRename(\''+pid+'\')">✏️ الاسم</button> '+
        '<button class="btn sm '+(arch?'':'ghost')+'" onclick="projArchive(\''+pid+'\','+(arch?'false':'true')+')">'+(arch?'↩️ استرجاع':'📦 أرشفة')+'</button>'+
      '</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<p class="muted" style="margin-top:8px">الأرشفة بتخفي العملية وبتحتفظ بتاريخها. الحذف النهائي + سجل التراجع هيتفعّلوا في مرحلة الإتمام.</p></div>';
  shell(h,'<div class="crumb"><a onclick="go(home)">🏠 الرئيسية</a> ← <a onclick="go(openOpsHome)">العمليات</a> ← إدارة العمليات</div>');
}
async function projRename(id){
  const p=PM.projs.find(x=>String(x.id)===String(id));if(!p)return;
  const nm=(prompt('الاسم الجديد للعملية:',p.name||'')||'').trim();if(!nm||nm===p.name)return;
  const nn=norm(nm);if(PM.projs.some(x=>String(x.id)!==String(id)&&String(x.archived)!=='TRUE'&&norm(x.name)===nn)){pfToast('فيه عملية بنفس الاسم',false);return;}
  try{await db.collection('Projects').doc(String(id)).set({name:nm},{merge:true});p.name=nm;renderProjManage();pfToast('اتعدّل ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
async function projArchive(id,on){
  const p=PM.projs.find(x=>String(x.id)===String(id));if(!p)return;
  try{await db.collection('Projects').doc(String(id)).set({archived:on?'TRUE':'FALSE'},{merge:true});p.archived=on?'TRUE':'FALSE';renderProjManage();pfToast(on?'اتأرشفت':'اترجّعت',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}
/* ===== 📐 نسب الإشراف + إشراف خارجي ===== */
let SR={projs:[]};
function openSupRates(){
  if(!meChair()){shell('<div class="card" style="text-align:center;padding:30px"><div style="font-size:34px">🔒</div><p class="muted">للرئيس بس.</p><button class="btn ghost" onclick="navBack()">رجوع</button></div>',crumbHome('نسب الإشراف'));return;}
  detachOps();
  shell('<div class="card" style="text-align:center;color:var(--muted);padding:30px">جاري التحميل…</div>',crumbHome('نسب الإشراف'));
  db.collection('Projects').get().then(s=>{SR.projs=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>String(p.archived)!=='TRUE').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));renderSupRates();});
}
function renderSupRates(){
  const h='<div class="card"><h3 style="margin:0">📐 نسب الإشراف وإعدادات العملية</h3>'+
    '<div class="muted" style="font-size:12px;margin-top:3px">المستحق على العميل = المنصرف + (المنصرف × النسبة). «إشراف خارجي» بيشيل العملية من التقارير افتراضياً.</div>'+
    '<div style="padding:0;overflow:auto;margin-top:10px" class="frm"><table><thead><tr><th>العملية</th><th>النسبة %</th><th>سعر الزيارة</th><th>إشراف خارجي</th><th></th></tr></thead><tbody>'+
    SR.projs.map(p=>{const pid=esc(p.id);return '<tr>'+
      '<td><b>'+esc(p.name||'—')+'</b></td>'+
      '<td><input id="sr_rate_'+pid+'" type="number" step="any" value="'+esc(p.supRate||0)+'" style="width:90px"></td>'+
      '<td><input id="sr_fee_'+pid+'" type="number" step="any" value="'+esc(p.visitFee||0)+'" style="width:90px"></td>'+
      '<td><label style="display:flex;align-items:center;gap:5px;margin:0"><input type="checkbox" id="sr_sup_'+pid+'" '+(String(p.supOnly)==='TRUE'?'checked':'')+'> 🔵</label></td>'+
      '<td><button class="btn sm" onclick="supRateSave(\''+pid+'\')">حفظ</button></td></tr>';}).join('')+
    '</tbody></table></div></div>';
  shell(h,crumbHome('نسب الإشراف'));
}
async function supRateSave(id){
  const rate=parseFloat((el('sr_rate_'+id)||{}).value)||0;
  const fee=parseFloat((el('sr_fee_'+id)||{}).value)||0;
  const sup=(el('sr_sup_'+id)||{}).checked;
  if(rate<0||rate>100){pfToast('النسبة بين 0 و 100',false);return;}
  if(fee<0){pfToast('السعر موجب',false);return;}
  try{await db.collection('Projects').doc(String(id)).set({supRate:rate,visitFee:fee,supOnly:sup?'TRUE':'FALSE'},{merge:true});
    const p=SR.projs.find(x=>String(x.id)===String(id));if(p){p.supRate=rate;p.visitFee=fee;p.supOnly=sup?'TRUE':'FALSE';}
    pfToast('اتحفظ ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}
}

function locColl(kind){return kind==='branch'?'Branches':'Projects';}
function locFind(kind,id){return (kind==='branch'?PL.branches:PL.projs).find(x=>String(x.id)===String(id));}
function parseCoord(s){s=String(s||'').trim();const m=s.match(/(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/);if(m)return{lat:+m[1],lng:+m[2]};const m2=s.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);if(m2)return{lat:+m2[1],lng:+m2[2]};return null;}
async function locCoords(kind,id){

    x.lat=String(c.lat);x.lng=String(c.lng);x.radius=String(r);renderProjLocs();pfToast('اتحفظ ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}

function locHere(kind,id){
  if(!navigator.geolocation){pfToast('الجهاز مايدعمش تحديد الموقع',false);return;}

    try{await db.collection(locColl(kind)).doc(String(id)).set({lat:String(pos.coords.latitude),lng:String(pos.coords.longitude),radius:String(r)},{merge:true});
      x.lat=String(pos.coords.latitude);x.lng=String(pos.coords.longitude);x.radius=String(r);renderProjLocs();pfToast('اتحفظ ✅',true);}catch(e){pfToast('تعذّر: '+(e.code||e.message),false);}

});}
let LMAP={map:null,marker:null,kind:'',id:''};

function locMapInit(x){
  var host=document.getElementById('locMapDiv');if(!host||!window.L)return;
  var lat=+x.lat||30.0444,lng=+x.lng||31.2357,hasC=!!(+x.lat&&+x.lng);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  var marker=L.marker([lat,lng],{draggable:true}).addTo(map);
  map.on('click',function(e){marker.setLatLng(e.latlng);});
  LMAP.map=map;LMAP.marker=marker;
  if(!hasC&&navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){var ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,16);marker.setLatLng(ll);},function(){},{timeout:6000});
  setTimeout(function(){map.invalidateSize();},200);
}
